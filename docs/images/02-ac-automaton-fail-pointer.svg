<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="920" height="620" fill="#fafbfc"/>
  <text x="460" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">Aho-Corasick 自动机：Trie + fail 指针</text>
  <text x="460" y="55" text-anchor="middle" font-size="13" fill="#57606a">词库：he / she / his / hers；扫描文本：u s h e r s</text>

  <!-- Trie 节点 -->
  <!-- root -->
  <circle cx="120" cy="300" r="28" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
  <text x="120" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">root</text>

  <!-- h -->
  <circle cx="260" cy="220" r="26" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="260" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#0969da">h</text>
  <!-- s -->
  <circle cx="260" cy="380" r="26" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="260" y="385" text-anchor="middle" font-size="14" font-weight="700" fill="#0969da">s</text>

  <!-- e (under h) -->
  <circle cx="420" cy="160" r="26" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="420" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#0969da">e</text>
  <!-- i (under h) -->
  <circle cx="420" cy="280" r="26" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="420" y="285" text-anchor="middle" font-size="14" font-weight="700" fill="#0969da">i</text>

  <!-- he terminal -->
  <circle cx="580" cy="120" r="28" fill="#dafbe1" stroke="#1a7f37" stroke-width="2.5"/>
  <text x="580" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#1a7f37">he✓</text>
  <!-- r (under he) -->
  <circle cx="580" cy="200" r="26" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="580" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#0969da">r</text>
  <!-- his terminal -->
  <circle cx="580" cy="280" r="28" fill="#dafbe1" stroke="#1a7f37" stroke-width="2.5"/>
  <text x="580" y="285" text-anchor="middle" font-size="14" font-weight="700" fill="#1a7f37">his✓</text>

  <!-- sh -->
  <circle cx="420" cy="380" r="26" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="420" y="385" text-anchor="middle" font-size="14" font-weight="700" fill="#0969da">h</text>
  <!-- she terminal -->
  <circle cx="580" cy="380" r="28" fill="#dafbe1" stroke="#1a7f37" stroke-width="2.5"/>
  <text x="580" y="385" text-anchor="middle" font-size="14" font-weight="700" fill="#1a7f37">she✓</text>

  <!-- hers terminal -->
  <circle cx="740" cy="200" r="28" fill="#dafbe1" stroke="#1a7f37" stroke-width="2.5"/>
  <text x="740" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#1a7f37">hers✓</text>

  <!-- Trie 边（实线） -->
  <line x1="146" y1="290" x2="236" y2="230" stroke="#57606a" stroke-width="1.8"/>
  <line x1="146" y1="310" x2="236" y2="370" stroke="#57606a" stroke-width="1.8"/>
  <line x1="284" y1="210" x2="396" y2="170" stroke="#57606a" stroke-width="1.8"/>
  <line x1="284" y1="230" x2="396" y2="270" stroke="#57606a" stroke-width="1.8"/>
  <line x1="444" y1="155" x2="554" y2="128" stroke="#57606a" stroke-width="1.8"/>
  <line x1="444" y1="170" x2="554" y2="195" stroke="#57606a" stroke-width="1.8"/>
  <line x1="444" y1="280" x2="554" y2="280" stroke="#57606a" stroke-width="1.8"/>
  <line x1="284" y1="385" x2="396" y2="385" stroke="#57606a" stroke-width="1.8"/>
  <line x1="444" y1="385" x2="554" y2="385" stroke="#57606a" stroke-width="1.8"/>
  <line x1="606" y1="200" x2="714" y2="200" stroke="#57606a" stroke-width="1.8"/>

  <!-- fail 指针（虚线红） -->
  <path d="M 420 186 Q 380 300 286 370" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#fr)"/>
  <text x="330" y="290" font-size="11" fill="#cf222e">fail: e→root</text>

  <path d="M 580 148 Q 620 200 590 252" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#fr)"/>
  <text x="620" y="180" font-size="11" fill="#cf222e">fail: he→root</text>

  <path d="M 580 352 Q 500 280 430 260" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#fr)"/>
  <text x="470" y="310" font-size="11" fill="#cf222e">fail: she→he</text>

  <path d="M 420 354 Q 380 280 286 232" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#fr)"/>
  <text x="300" y="320" font-size="11" fill="#cf222e">fail: sh→h</text>

  <!-- 扫描轨迹 -->
  <rect x="60" y="470" width="800" height="120" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="80" y="495" font-size="13" font-weight="700" fill="#1f2328">扫描 "ushers" 时的命中点：</text>
  <text x="80" y="520" font-size="12" fill="#1a7f37">① 走到 s h e → 命中 "she"（同时沿 fail 链发现 "he" 也命中）</text>
  <text x="80" y="543" font-size="12" fill="#1a7f37">② 走到 h e r s → 命中 "hers"（同时沿 fail 链发现 "he" 也命中）</text>
  <text x="80" y="566" font-size="12" fill="#57606a">一次扫描同时收集到 4 个命中：she / he / hers / he——决策层取最严重动作，不"首词定生死"。</text>

  <defs>
    <marker id="fr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#cf222e"/>
    </marker>
  </defs>
</svg>
