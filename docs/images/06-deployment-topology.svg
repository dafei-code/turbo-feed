<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="920" height="560" fill="#fafbfc"/>
  <text x="460" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">部署拓扑（本地 → 生产）</text>

  <!-- 客户端 -->
  <rect x="350" y="60" width="220" height="50" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="460" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#0969da">App / Web 客户端</text>

  <!-- 网关集群 -->
  <rect x="180" y="150" width="560" height="100" rx="10" fill="#fff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="460" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">tf-gateway 集群（无状态，×N 副本）</text>
  <rect x="220" y="190" width="140" height="44" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="290" y="217" text-anchor="middle" font-size="12" fill="#1f2328">ContentSecurityService</text>
  <rect x="400" y="190" width="120" height="44" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="460" y="217" text-anchor="middle" font-size="12" fill="#1f2328">AC 快照</text>
  <rect x="560" y="190" width="140" height="44" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="630" y="217" text-anchor="middle" font-size="12" fill="#1f2328">SensitiveWordService</text>

  <!-- MySQL -->
  <rect x="80" y="310" width="200" height="90" rx="8" fill="#fff" stroke="#d0d7de"/>
  <text x="180" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">MySQL（ds_0）</text>
  <text x="180" y="355" text-anchor="middle" font-size="11" fill="#57606a">词库 / 白名单 / 审计命中</text>
  <text x="180" y="372" text-anchor="middle" font-size="11" fill="#57606a">坏样本库 / review_task</text>

  <!-- Redis -->
  <rect x="330" y="310" width="200" height="90" rx="8" fill="#fff" stroke="#d0d7de"/>
  <text x="430" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">Redis Cluster</text>
  <text x="430" y="355" text-anchor="middle" font-size="11" fill="#57606a">限流计数 / 热缓存</text>
  <text x="430" y="372" text-anchor="middle" font-size="11" fill="#57606a">（鉴权 JWT 无状态，不挡登录）</text>

  <!-- sidecar -->
  <rect x="580" y="310" width="260" height="90" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-dasharray="4,3"/>
  <text x="710" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#9a6700">语义 sidecar（Python FastAPI）</text>
  <text x="710" y="355" text-anchor="middle" font-size="11" fill="#57606a">embedding 近邻 / /score</text>
  <text x="710" y="372" text-anchor="middle" font-size="11" fill="#57606a">×N，独立扩缩容</text>

  <!-- 运营后台 -->
  <rect x="280" y="450" width="360" height="70" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="460" y="478" text-anchor="middle" font-size="13" font-weight="700" fill="#1a7f37">运营后台（审核员 / 管理员）</text>
  <text x="460" y="498" text-anchor="middle" font-size="11" fill="#57606a">词库热更 · 白名单 · 命中列表 · 人审裁决 · 坏样本录入</text>

  <!-- 连线 -->
  <line x1="460" y1="110" x2="460" y2="148" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a6)"/>
  <line x1="300" y1="250" x2="200" y2="308" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a6)"/>
  <line x1="460" y1="250" x2="430" y2="308" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a6)"/>
  <line x1="620" y1="250" x2="710" y2="308" stroke="#9a6700" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a6y)"/>
  <line x1="460" y1="450" x2="460" y2="400" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a6g)"/>

  <defs>
    <marker id="a6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/>
    </marker>
    <marker id="a6y" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#9a6700"/>
    </marker>
    <marker id="a6g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1a7f37"/>
    </marker>
  </defs>
</svg>
