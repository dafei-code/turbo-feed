# =============================================================================
# ShardingSphere 分片配置（turbo-feed-gateway 元数据层）
# -----------------------------------------------------------------------------
# 作用：网关元数据（当前为 user 表）按 id 分库分表，路由对业务代码透明。
# 启用方式：application.yml 中
#           spring.datasource.url=jdbc:shardingsphere:classpath:shardingsphere-config.yaml
#           + driver-class-name=org.apache.shardingsphere.driver.ShardingSphereDriver
#
# 算法选型：Apache ShardingSphere 5.5.3 内置 HASH_MOD 算法
#   - 算法类：org.apache.shardingsphere.sharding.algorithm.sharding.mod.HashModShardingAlgorithm
#   - 版本：5.5.3（5.5.0 带的 test-util 依赖未发布到 Maven Central，会导致解析失败；
#     Apache PR #31143 已在 5.5.1+ 修复，5.5.3 为当前 5.5.x 最新稳定版）
#   - 配套前置算法契约：actualDataNodes 必须按 `prefix${0..N-1}` 模式书写（如 ds_${0..1}.user_${0..1}），
#     因内置算法按 DataNodeInfo.prefix + 哈希后填充下标拼接目标名，最后用 contains() 命中 availableTargetNames。
#   - 由 props.sharding-count 显式指定该层候选目标数（不是按 availableTargetNames.size() 自动适配），
#     扩容/缩容需同步改 sharding-count，避免分母失配。
#
# 真实数据源账号密码：本文件内配置仅供克隆即跑；生产请用环境变量/密钥管理注入，勿硬编码。
# =============================================================================

# 数据源集合：2 个库（ds_0 / ds_1），对应物理 MySQL 实例 turbo_feed_1 / turbo_feed_2
dataSources:
  ds_0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    # TODO 生产替换为 ENV: TURBO_FEED_DS_0_URL（密钥管理/配置中心注入）
    jdbcUrl: jdbc:mysql://127.0.0.1:3306/turbo_feed_1?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: "123456"
  ds_1:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://127.0.0.1:3306/turbo_feed_2?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: "123456"

rules:
  - !SHARDING
    # 采用 autoTables（自动分片）而非 tables（手动分片）：
    # ShardingSphere 5.5.x 把 HASH_MOD / MOD 归类为「自动分片算法」，只能用于 autoTables；
    # 手动 tables 引用会报 "tables sharding configuration can not use auto sharding algorithm"。
    # autoTables + HASH_MOD(sharding-count=总物理节点数) 自动把分片摊到各库各表，
    # 物理表命名约定 <逻辑表>_<0..N-1>（本例 sharding-count=4 → user_0..user_3、media_0..media_3）由 SS 推断；
    # 落库规则：第 i 张表落到 actualDataSources.get(i % 库数)，即 ds_0→{_0,_2}、ds_1→{_1,_3}。
    # init-local.sql 的建表命名必须与此一致（见其头部说明），否则报 Table doesn't exist。
    autoTables:
      # 逻辑表 user：2 库(ds_0/ds_1) × 2 表 = 4 物理节点，按 id 哈希取模路由
      user:
        actualDataSources: ds_0, ds_1
        shardingStrategy:
          standard:
            shardingColumn: id
            # autoTables 通过 shardingAlgorithmName 引用下方具名算法（HASH_MOD 是自动分片算法，仅 autoTables 可用；
            # 注意：standard 策略只接受 shardingAlgorithmName 引用，不接受内联 shardingAlgorithm 块）
            shardingAlgorithmName: hashMod
        # 主键生成（雪花 ID）；业务侧也会显式传 id，传入时以传入值为准
        keyGenerateStrategy:
          column: id
          keyGeneratorName: snowflake
      # 逻辑表 media：分片键 user_id，与 user 表同策略，
      # 保证「同用户」的 user 行与其 media 落同片，「我的上传」WHERE user_id=? 精准命中单分片
      media:
        actualDataSources: ds_0, ds_1
        shardingStrategy:
          standard:
            shardingColumn: user_id
            shardingAlgorithmName: hashMod
      # 逻辑表 account_credit：分片键 user_id，与 user/media 同策略，
      # 保证「同用户」的信用行与其 user 行、media 行落同片；ensure/deduct/restore 均 WHERE user_id=? 单分片命中。
      account_credit:
        actualDataSources: ds_0, ds_1
        shardingStrategy:
          standard:
            shardingColumn: user_id
            shardingAlgorithmName: hashMod
      # 逻辑表 report / appeal：分片键 media_id，
      # 举报/申诉高频查询均按 media_id（insert(media_id) / resolve(WHERE media_id=?)）精准命中单分片；
      # 管理员待处理列表(按 status)为广播，低频可接。
      report:
        actualDataSources: ds_0, ds_1
        shardingStrategy:
          standard:
            shardingColumn: media_id
            shardingAlgorithmName: hashMod
      appeal:
        actualDataSources: ds_0, ds_1
        shardingStrategy:
          standard:
            shardingColumn: media_id
            shardingAlgorithmName: hashMod
      # 逻辑表 comment：分片键 media_id（与 media 按 user_id 分片正交），
      # 保证「读某条内容下所有评论」单分片命中，不依赖 media 所在库即可定位评论；
      # 楼中楼一级列表按 media_id+root_id+created_at 走索引，避免扫全分片。
      comment:
        actualDataSources: ds_0, ds_1
        shardingStrategy:
          standard:
            shardingColumn: media_id
            shardingAlgorithmName: hashMod
        keyGenerateStrategy:
          column: comment_id
          keyGeneratorName: snowflake
    # 分片算法（自动分片算法，仅 autoTables 引用；sharding-count = 总物理节点数 = 库数2 × 表数2 = 4）
    shardingAlgorithms:
      hashMod:
        type: HASH_MOD
        props:
          sharding-count: 4
    # 主键生成器：雪花 ID，与 userId 体系一致
    keyGenerators:
      snowflake:
        type: SNOWFLAKE

props:
  # 开发期打印实际落到的物理库/表与 SQL，便于核对路由；生产可关闭
  sql-show: true
