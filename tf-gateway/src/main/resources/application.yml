# turbo-feed 网关配置骨架（参数按设计文档逐模块填充）
spring:
  application:
    name: turbo-feed-gateway
  # 数据源走 ShardingSphere 原生驱动：从 classpath 读取 shardingsphere-config.yaml，
  # 由该文件定义真实数据源(ds_0/ds_1)与分片规则；真实账号密码在配置文件内，此处不再设置
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:shardingsphere-config.yaml
  # multipart 框架层限额（业务层 turbofeed.media.* 之外的前置兜底，略高于业务限额）
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 60MB
  # Redis（Lettuce，懒连接）：上传用户级限流等轻量 KV；本地未启动 Redis 不影响应用启动，
  # 但 /actuator/health 中 redis 组件会显示 DOWN（整体状态默认不受其拉低，management 如需忽略可排除）
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 500ms
      lettuce:
        pool:
          # 网关以同步命令为主，但上传限流为并发场景，启用小连接池复用连接、吸收抖动；
          # 依赖 commons-pool2（lettuce-core 的 optional 依赖不传递；已在 tf-gateway pom 显式声明），启用连接池复用连接、吸收抖动
          enabled: true
          max-active: 16        # 最大连接数（并发上限）
          max-idle: 8            # 最大空闲连接
          min-idle: 2            # 最小空闲连接（预热，避免冷启动建连抖动）
          max-wait: 1000ms       # 获取连接最大等待（超时即失败，快速失败而非线程堆积）
        shutdown-timeout: 100ms
      # 生产集群 / 哨兵示例（二选一取消注释，并删除上面的单机 host/port）：
      # cluster:
      #   nodes:
      #     - 10.0.0.1:6379
      #     - 10.0.0.2:6379
      #     - 10.0.0.3:6379
      #   max-redirects: 3
      # sentinel:
      #   master: turbo-feed-redis
      #   nodes:
      #     - 10.0.0.1:26379
      #     - 10.0.0.2:26379
      #     - 10.0.0.3:26379

# Redis 就绪前关闭其健康指示器，避免 /actuator/health 整体被拉成 DOWN（克隆即跑）；
# 本地启动 Redis 后改为 true（或直接删除此段）
management:
  health:
    redis:
      enabled: false

server:
  port: 8080

turbofeed:
  # JWT 签发配置；secret 生产必须替换为密钥管理注入的高熵值
  jwt:
    secret: turbofeed-demo-secret-change-me
    expire-seconds: 86400
  # 管理员配置（demo 阶段）：手机号白名单派生 ADMIN 角色。
  # 登录时手机号命中 phones 即签发 ADMIN 令牌，可访问 /api/admin/**；
  # 生产应替换为 user 表 role 列 + RBAC，移除本白名单。
  admin:
    phones:
      - "13800138000"
  # 演示登录账号：键为手机号，值为账号信息（密码 + uid）；
  # 对标抖音：令牌 sub 携带 uid（身份层），手机号仅作登录凭证（凭证层），不进入令牌、不参与分片。
  # 生产改数据库 + user_phone_router(phone→uid) 映射 + 哈希存储
  auth:
    demo-users:
      "13800138000":
        password: "123456"
        uid: 10001
  # 媒体上传限额：调整阈值只改配置不发版
  media:
    key-prefix: media
    max-file-size: 5MB
    max-batch-count: 9
    # 对外访问基址：存储实现拼装返回 URL 时的前缀。
    # local 模式下须指向本服务（含端口），使返回的图片 URL 可被浏览器直接加载；
    # 切到对象存储后改为其公网域名 / CDN 域名。
    # 切到 MinIO 后指向对象存储访问基址（bucket 需匿名可读，否则返回的 URL 浏览器 403）
    public-url-base: http://127.0.0.1:9000/turbo-feed-media/
    # 存储实现：local=本地磁盘真实落盘（默认，保证「上传→展示」链路可跑通）；
    # placeholder=仅拼装 URL 不落盘（回归占位行为时用）
    storage: minio
    # 本地落盘根目录（storage=local 时生效），与 WebConfig 的 /media/** 静态映射共享此值，
    # 避免「写入目录」与「读取目录」两处配置漂移导致 404
    local-dir: ./data/media
    # 对象存储（MinIO）连接配置：仅 storage=minio 时生效；开发期凭据硬编码，生产改用 ENV 注入
    minio:
      endpoint: http://127.0.0.1:9000
      access-key: minioadmin
      secret-key: minioadmin
      bucket: turbo-feed-media
    # 图片处理链（Decorator：缩略图缩放）。默认关闭保持流式零内存路径；
    # 开启后经 ImageIO 解码重编码（12MP ARGB ≈ 48MB/张），需评估上传 QPS 与堆内存
    processing-enabled: false
    thumbnail-max-dimension: 2048
    # 上传限流分工：thread/qps 走 Sentinel 注解（机器维度，@SentinelResource 埋点于 MediaUploadService#upload）；
    # per-user 走 Redis UploadRateLimiter（用户维度，注解热点参数取不到 ThreadLocal 的 userId，跨实例计数）
    rate-limit:
      thread: 20
      qps: 100
      per-user: 10
      # 同用户上传并发占位 TTL（秒）：进程崩溃 / 释放失败时的兜底过期时间（ConcurrentUploadValidator 消费）
      inflight-ttl-seconds: 30
    # MQ 事件总线主题 / 消费组：RocketMqMediaEventPublisher 与 MediaReviewConsumer 共用同一配置键，
    # 缺省 turbofeed-media-uploaded / turbofeed-media-review-group；修改须发布端与消费端一致
    mq:
      topic: turbofeed-media-uploaded
      consumer-group: turbofeed-media-review-group
    # 审核模式：false=真审核闸（上传停在 PENDING，由管理员审核接口通过/驳回）；
    # true=演示占位（AutoPassModeration 机审桩直接放行，仅本地联调用）。生产务必 false。
    review:
      auto-pass: false
      # 机审策略（可插拔开关，决定激活哪个 ContentModeration 实现）：
      #   pass = AutoPassModeration 占位桩（恒 APPROVED，仅机审不拦截，下游仍卡人审闸；当前默认，纯人审）
      #   ai   = AiContentModeration（Ollama 本地视觉模型，已卸载；保留为「类抖音机器初审」后续接入点）
      #   cloud（预留）= 将来接云内容安全 API（腾讯云/阿里云）做类抖音机器初审，审核主流程零改动
      # 注意：无论哪种机审，默认策略都是「驳回即拦 · 通过仍人审」，机审不直接放行到公域。
      # 当前阶段：先纯人审跑通审核页（moderation-mode=pass），抖音式机器初审后续按架构方案接入。
      moderation-mode: pass
  # MQ（RocketMQ）事件总线：
  # 本地开发已部署 RocketMQ（Docker: rmqnamesrv 127.0.0.1:9876），启用跨进程投递。
  # 若未部署 RocketMQ 且希望「克隆即跑」，改为 false 回退到本地 Spring 事件。
  mq:
    enabled: true
  fanout:
    push-threshold: 1000        # 大 V 判定：粉丝数阈值
    inbox-max-size: 2000        # 收件箱 LTRIM 定长
    inbox-read-size: 500        # 首屏读取条数
    outbox-retain-days: 7       # 大 V outbox 保留天数
    inactive-days: 7            # 活跃度分层：N 日未登录跳过推送
  counter:
    bucket-count: 64            # 热点计数分桶数
    batch-flush-interval-ms: 2000  # 批量落库周期
  hotspot:
    window-seconds: 10          # 滑动窗口长度
    hot-threshold: 1000         # 热 Key 判定阈值（窗口内访问次数）
    l1-ttl-seconds: 3           # L1 本地缓存 TTL

# Sentinel：默认本地 JSON 规则（克隆即跑），可选 Nacos push
# sentinel:
#   datasource:
#     flow:
#       file:
#         file: classpath:sentinel/rules.json

# RocketMQ 启用配置（turbofeed.mq.enabled=true 时生效）
# name-server 三处都显式声明：顶层（生产者/全局兜底）+ producer + consumer。
# PUSH 消费者在 rocketmq-spring-boot-starter 里优先读 rocketmq.consumer.name-server，
# 仅配顶层会导致消费端 setNamesrvAddr 不被调用、启动报 "connect to null failed"；
# 三处齐设可兼容不同 starter 版本的属性解析路径。
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: turbofeed-media-producer-group
    name-server: 127.0.0.1:9876
    send-msg-timeout: 1000   # 调短发送超时：MQ 不可用时更快触发降级，而非长时间阻塞上传线程
  consumer:
    name-server: 127.0.0.1:9876
