# turbo-feed 网关配置骨架（参数按设计文档逐模块填充）
spring:
  application:
    name: turbo-feed-gateway
  # 数据源走 ShardingSphere 原生驱动：从 classpath 读取 shardingsphere-config.yaml，
  # 由该文件定义真实数据源(ds_0/ds_1)与分片规则。URL 携带 placeholder-type=ENVIRONMENT，
  # SS 配置内的环境占位符在加载期由 ShardingSphereURLLoadEngine 从进程环境变量渲染
  # （TURBOFEED_DB_PASSWORD 等，缺失时回落占位符默认值）——仓库内不出现任何真实口令。
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:shardingsphere-config.yaml?placeholder-type=ENVIRONMENT
  # multipart 框架层限额（业务层 turbofeed.media.* 之外的前置兜底，略高于业务限额）
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 60MB
  # Redis（Lettuce，懒连接）：上传用户级限流等轻量 KV；本地未启动 Redis 不影响应用启动，
  # 但 /actuator/health 中 redis 组件会显示 DOWN（整体状态默认不受其拉低，management 如需忽略可排除）
  data:
    redis:
      host: localhost
      port: 6379
      # 密码外部化：默认空串 = 无密码。启用带密码的 Redis 时用 TURBOFEED_REDIS_PASSWORD 注入，
      # 不把真实密码写进默认配置；未注入而 Redis 要求鉴权时会直接 NOAUTH（不静默降级）。
      password: ${TURBOFEED_REDIS_PASSWORD:}
      timeout: 500ms
      lettuce:
        pool:
          # 网关以同步命令为主，但上传限流为并发场景，启用小连接池复用连接、吸收抖动；
          # 依赖 commons-pool2（lettuce-core 的 optional 依赖不传递；已在 tf-gateway pom 显式声明），启用连接池复用连接、吸收抖动
          enabled: true
          # 容量估算（changelog 0038）：上传并发上限 200（Sentinel rate-limit.thread）×
          # 单请求 Redis 次数约 3（用户级限流 + 并发占位 + 状态缓存）× 单次命令约 0.2ms
          # → 稳态只需 ~12 条连接；取 4 倍余量 64，吸收抖动与偶发慢命令，不至于在 max-wait 前排队。
          # 上限约束：Redis 侧 maxclients（默认 10000）÷ 网关实例数，别把单实例的池开到吃掉全局配额。
          max-active: 64         # 最大连接数（并发上限）
          max-idle: 24           # 最大空闲连接（稳态并发量，避免反复建连/关连）
          min-idle: 8            # 最小空闲连接（预热，避免冷启动建连抖动）
          max-wait: 1000ms       # 获取连接最大等待（超时即失败，快速失败而非线程堆积）
        shutdown-timeout: 100ms
      # 生产集群 / 哨兵示例（二选一取消注释，并删除上面的单机 host/port）：
      # cluster:
      #   nodes:
      #     - 10.0.0.1:6379
      #     - 10.0.0.2:6379
      #     - 10.0.0.3:6379
      #   max-redirects: 3
      # sentinel:
      #   master: turbo-feed-redis
      #   nodes:
      #     - 10.0.0.1:26379
      #     - 10.0.0.2:26379
      #     - 10.0.0.3:26379

# Redis 就绪前关闭其健康指示器，避免 /actuator/health 整体被拉成 DOWN（克隆即跑）；
# 本地启动 Redis 后改为 true（或直接删除此段）
management:
  health:
    redis:
      enabled: false

server:
  port: 8080

turbofeed:
  # JWT 签发配置
  jwt:
    # 签名密钥：**刻意无默认值**（同 snowflake 的实例标识），未注入即启动失败。
    # 原因（P0）：密钥一旦有兜底默认值，生产漏配就会静默使用仓库里公开的 demo 串，
    # 攻击者可直接签发任意 userId + role=ADMIN 的令牌。两道保障缺一不可：
    #   ① 此处 `${TURBOFEED_JWT_SECRET:}` 不允许出现字面量；
    #   ② JwtProperties 的字段同样无默认值（否则占位符缺失时会回落到字段初始值）。
    secret: ${TURBOFEED_JWT_SECRET:}
    expire-seconds: 86400
  # 雪花 ID 的实例标识（各 0~31）。多实例部署必须逐实例注入不同取值：
  # 同一组取值会让两个实例在同一毫秒生成相同的 ID，user 表主键插入直接冲突（注册失败）。
  # K8s 可用 StatefulSet 序号 / POD_NAME 尾号派生后注入环境变量。
  # 刻意「无默认值」：缺失即启动失败（SnowflakeConfig#requireInstanceId），
  # 单实例本地开发也必须显式给一次，避免 1/1 兜底在多实例下静默复发撞主键。
  snowflake:
    worker-id: ${TURBOFEED_SNOWFLAKE_WORKER_ID:}
    datacenter-id: ${TURBOFEED_SNOWFLAKE_DATACENTER_ID:}
  # Feed 引擎（tf-feed-engine，默认 8083）调用配置：Feed 时间线读模型已迁至独立部署单元，
  # 网关只做转发 + 降级决策，不再持有任何 Feed 读模型或推荐流缓存
  feed:
    engine:
      # 当前为直连形态（克隆即跑）；引入 Nacos 服务发现 + LoadBalancer 后，此项退化为兜底/调试用
      base-url: ${TURBOFEED_FEED_ENGINE_BASE_URL:http://localhost:8083}
      # 同步调用必须设超时：引擎故障时若无限等待，网关线程池会被慢调用耗尽（雪崩入口）
      connect-timeout: 500ms
      read-timeout: 2s
    # 引擎不可用时的降级口径：
    #   empty（默认）= 返回空列表 + WARN 日志，绝不跨分片广播 —— 生产必须保持此值
    #   local-scan  = 回源 listApprovedGlobal 广播查询全部分片（等价拆分前行为，仅本地/演示）
    degraded-mode: ${TURBOFEED_FEED_DEGRADED_MODE:empty}
  # 角色来源（真 RBAC）：用户角色由 user 表 role 列承载（USER / REVIEWER / ADMIN），
  # 登录时直接读库派生 JWT，不在配置里维护任何手机号白名单——保持默认配置纯净、无 demo 字面量。
  # 生产改数据库 + user_phone_router(phone→uid) 映射 + 哈希存储；角色变更走数据运维而非改配置。
  # 演示账号：种子数据已写入 deploy/mysql/init-local.sql（role 列已写入），重新执行脚本后即可登录：
  #   管理员   13800138000 / 123456（role=ADMIN，进 admin.html）
  #   审核员   13700137000 / 123456（role=REVIEWER，进 review.html）
  #   普通用户 13900139000 / 123456（role=USER，进 user.html）
  # 对标抖音：令牌 sub 携带 uid（身份层），手机号仅作登录凭证（凭证层），不进入令牌、不参与分片。
  # 媒体上传限额：调整阈值只改配置不发版
  media:
    key-prefix: media
    max-file-size: 5MB
    max-batch-count: 9
    # 对外访问基址：存储实现拼装返回 URL 时的前缀。
    # local 模式下须指向本服务（含端口），使返回的图片 URL 可被浏览器直接加载；
    # 切到对象存储后改为其公网域名 / CDN 域名。
    # 切到 MinIO 后指向对象存储访问基址（bucket 需匿名可读，否则返回的 URL 浏览器 403）
    public-url-base: http://127.0.0.1:9000/turbo-feed-media/
    # 存储实现：local=本地磁盘真实落盘（默认，保证「上传→展示」链路可跑通）；
    # placeholder=仅拼装 URL 不落盘（回归占位行为时用）
    storage: minio
    # 本地落盘根目录（storage=local 时生效），与 WebConfig 的 /media/** 静态映射共享此值，
    # 避免「写入目录」与「读取目录」两处配置漂移导致 404
    local-dir: ./data/media
    # 对象存储（MinIO）连接配置：仅 storage=minio 时生效；凭据必须来自环境变量注入，禁止硬编码
    minio:
      endpoint: http://127.0.0.1:9000
      access-key: ${TURBOFEED_MINIO_ACCESS_KEY:}
      secret-key: ${TURBOFEED_MINIO_SECRET_KEY:}
      bucket: turbo-feed-media
    # 图片处理链（Decorator：缩略图缩放）。默认关闭保持流式零内存路径；
    # 开启后经 ImageIO 解码重编码（12MP ARGB ≈ 48MB/张），需评估上传 QPS 与堆内存
    processing-enabled: false
    thumbnail-max-dimension: 2048
    # 预签名直传（客户端直传对象存储，网关不收字节流）：上传凭证有效期（秒）。
    # 过期后客户端需重新申请；重签会复用同一批对象名，不会让孤儿对象随重试翻倍。
    presign:
      expiry-seconds: 300
      # 孤儿对象清理：客户端传完却未通知完成（放弃 / 断网 / 崩溃）会留下无 DB 行引用的对象，
      # 由定时任务按「预约已过期且未释放」的保守口径回收
      orphan-cleanup-enabled: true
      orphan-cleanup-batch: 200
      # 清理周期（ms，默认 600000=10 分钟）：turbofeed.media.presign.orphan-cleanup-fixed-delay-ms
    # 上传限流分工：thread/qps 走 Sentinel 注解（机器维度，@SentinelResource 埋点于 MediaUploadService#upload）；
    # per-user 走 Redis UploadRateLimiter（用户维度，注解热点参数取不到 ThreadLocal 的 userId，跨实例计数）
    rate-limit:
      thread: 200
      qps: 2000
      per-user: 10
      # 同用户上传并发占位 TTL（秒）：进程崩溃 / 释放失败时的兜底过期时间（ConcurrentUploadValidator 消费）
      inflight-ttl-seconds: 30
    # MQ 事件总线主题 / 消费组：RocketMqMediaEventPublisher 与 MediaReviewConsumer 共用同一配置键，
    # 缺省 turbofeed-media-uploaded / turbofeed-media-review-group；修改须发布端与消费端一致
    mq:
      topic: turbofeed-media-uploaded
      consumer-group: turbofeed-media-review-group
    # 审核模式：false=真审核闸（上传停在 PENDING，由管理员审核接口通过/驳回）；
    # true=演示占位（AutoPassModeration 机审桩直接放行，仅本地联调用）。生产务必 false。
    review:
      auto-pass: false
      # 机审策略（可插拔开关，决定激活哪个 ContentModeration 实现）：
      #   rule = RuleBasedModeration 本地规则引擎（文件名/元数据级 fail-closed，非 AI 视觉；当前默认，机审初筛骨架）
      #   pass = AutoPassModeration 占位桩（恒 APPROVED，仅机审不拦截，下游仍卡人审闸）
      #   ai   = AiContentModeration（Ollama 本地视觉模型，已卸载；保留为「类抖音机器初审」后续接入点）
      #   cloud（预留）= 将来接云内容安全 API（腾讯云/阿里云）做类抖音机器初审，审核主流程零改动
      # 注意：机审不直接决定公域可见性——机审通过后<b>按账号信用分级</b>分流：
      #   · L0（新人观察期 / 违规加严）→ 先审后放：停在 PENDING 等人工终裁
      #   · L1 / L2（正常 / 高信用）→ 先发后审：直接 APPROVED 进对应流量池，靠举报与人审兜底
      # 机审 REJECTED 则立即拦截，不进人审队列。
      # 当前 MVP：机审初筛用 rule（本地规则引擎），视觉语义识别留 cloud（需云 API key）。
      moderation-mode: rule
      # 新人观察期解除阈值：新注册账号初始「先审后放」，人工审核累计通过该帖数后自动转正常分级
      # （只统计人工通过，不含先发后审的自动通过）
      new-user-approve-threshold: 3
  # ==================== 内容安全（文本审核）====================
  # 统一入口：ContentSecurityService（场景 NICKNAME / CAPTION / COMMENT）。
  # 为什么独立于 media.review：昵称、评论都不是「媒体」的事——挂在 media 下会让后来者
  # 以为只有上传才需要检测，而历史上昵称正因如此完全没被过滤。
  # 本段刻意不含任何具体词条：词条是运营数据（sensitive_word / sensitive_whitelist 表 +
  # admin 接口维护），把词写进默认配置等于让「克隆即跑」自带一份不该公开的名单。
  content-security:
    # 总开关。关闭后所有检测直接放行——仅用于「怀疑本模块误杀」时的快速回滚。
    enabled: true
    # 启动时若词库为空是否直接失败：默认 false 以保「克隆即跑」（本地开发/测试常常不需要词库）；
    # 生产部署务必置 true，把「忘了导词库」挡在部署阶段——否则词库为空时过滤静默失效、无人察觉。
    fail-startup-on-empty-dictionary: ${TURBOFEED_FAIL_ON_EMPTY_DICT:false}
    # 各场景长度上限（字符数）。必须与 DB 列宽、前端输入上限保持同一事实源：
    #   NICKNAME 32   — 昵称是全站公开展示位，短且必须严（抖音昵称上限 24）
    #   CAPTION  2048 — 对齐 media.caption VARCHAR(2048)；否则超长在 DB 严格模式下抛 500 级错误而非友好参数错误
    #   COMMENT  1024 — 原 CommentService.MAX_CONTENT_LEN，现归口于此
    scene-max-length:
      NICKNAME: 32
      CAPTION: 2048
      COMMENT: 1024
    # 未单独配置长度的场景的兜底上限；同时限制 AC 扫描成本（防超长文本拖慢写路径 P99）
    max-text-length: 4096
    # 归一化（抗绕过）：NFKC 折叠全角/兼容字符 → 剥离不可见字符（恒开，无开关）→ 剥离分隔符 → 小写 → 繁简折叠
    normalize:
      enabled: true
      # 剥分隔符是误杀率最高、收益也最高的一步（「涉-黄」「涉 黄」这类穿插都能拦下）；
      # 代价是「顺 丰 车」可能被拼成敏感词——出口是白名单，二者必须配合使用。
      strip-separators: true
      # 只覆盖常用繁体字表（不是完整 OpenCC 转换）；未覆盖的生僻繁体仍可绕过，属已知边界。
      fold-traditional: true
    # 白名单（误杀治理出口）：sensitive_whitelist 表 + admin 接口维护，默认开启。
    whitelist-enabled: true
    # 分类 → 处置动作。留空 = 所有分类统一走 default-action（与改造前「命中即拒」行为一致）。
    # 运营明确策略后再逐条配置，例如「广告类只降权不拦截」→ AD: LIMIT
    # 取值：PASS / LIMIT（放行+标降权，当前等同 PASS）/ REVIEW（转人审，当前等同 BLOCK）/ BLOCK
    category-actions: {}
    default-action: BLOCK
  # MQ（RocketMQ）事件总线：默认关闭，未部署 RocketMQ 时也能「克隆即跑」。
  # 开启方式见 application-mq.yml（--spring.profiles.active=mq），NameServer 地址可用
  # TURBOFEED_ROCKETMQ_NAME_SERVER 覆盖。
  # 为什么放在本文件的是「开关」而不是 rocketmq.* 配置块：rocketmq-spring 的
  # @ConditionalOnProperty(prefix="rocketmq", value="name-server") 没有 havingValue，
  # 属性「存在但为空」同样算命中 → 生产者 Bean 会被创建、启动时调用 producer.start()。
  # 因此空值占位符做不到「不创建 Bean」，只能靠 profile 让属性真正缺席。
  mq:
    enabled: ${TURBOFEED_MQ_ENABLED:false}
  # 事务发件箱（P0-3 / changelog 0037）：事件行与业务数据同事务落库，提交后直投 + 中继补偿重投。
  # 语义是「至少一次投递」，重复由消费端幂等消化（Feed 引擎侧 append/remove 已幂等）。
  outbox:
    max-attempts: 5            # 单条事件最大尝试次数，达上限置 DEAD 等待人工对账
    backoff-seconds: 5         # 退避基数：实际间隔 = backoff × attempt_count（封顶 300s）
    batch-size: 100            # 中继单轮最多取多少条
    poll-interval-ms: 2000     # 中继轮询间隔（fixedDelay：上轮没跑完不会开下轮）
    initial-delay-ms: 10000    # 启动后延迟开始，避开启动期的连接池/依赖未就绪
    stuck-timeout-seconds: 60  # SENDING 超过此时间未落地视为投递进程崩溃，回收重投
    relay-enabled: true        # 排障时可临时关掉（不影响落库与快路径直投，只是失去补偿）
  # Redis 拓扑（changelog 0038）：
  #   single   = 单机（默认）。此时 RedisTopologyConfig 一个 Bean 都不注册，完全交给 Boot 自动装配，
  #              与改造前逐字节一致，保证「克隆即跑」。
  #   cluster  = Redis Cluster，节点地址由 TURBOFEED_REDIS_CLUSTER_NODES 注入（逗号分隔 host:port）。
  #   sentinel = 哨兵，需同时注入 master 名与哨兵节点。
  # 节点地址一律外部注入，默认配置刻意不出现任何内网 IP（与 JWT 密钥 / MinIO 凭据同一纪律）。
  # ⚠️ 集群化有运维硬前提：Cluster 至少 3 主 3 从、Sentinel 至少 3 个哨兵，否则故障切换的正确性
  #    无从谈起——只起 1~2 个节点并不能叫「上了集群」。
  redis:
    mode: ${TURBOFEED_REDIS_MODE:single}
    cluster-nodes: ${TURBOFEED_REDIS_CLUSTER_NODES:}
    sentinel-master: ${TURBOFEED_REDIS_SENTINEL_MASTER:}
    sentinel-nodes: ${TURBOFEED_REDIS_SENTINEL_NODES:}
    max-redirects: 3
  # 账号状态本地缓存（changelog 0039）：信用等级 / 可写闸门的进程内短 TTL 缓存，
  # 消除上传热路径上每次必打的 account_credit 读 + account_penalty 读。
  # ttl 是「跨实例不一致」的上界：A 实例封禁后，B 实例最长 ttl 后才可见。
  # 怀疑缓存导致状态不更新时置 enabled=false 即可一键退回直读。
  state-cache:
    enabled: ${TURBOFEED_STATE_CACHE_ENABLED:true}
    ttl-seconds: ${TURBOFEED_STATE_CACHE_TTL_SECONDS:15}
    max-entries: ${TURBOFEED_STATE_CACHE_MAX_ENTRIES:100000}
    # 跨实例失效广播（Redis pub/sub，changelog 0042）：关闭后退回「TTL 兜底」，
    # 不一致窗口从「毫秒级」回到「最长 ttl-seconds」。Redis 不可用时也会自动退化，不会阻断写路径。
    broadcast-enabled: ${TURBOFEED_STATE_CACHE_BROADCAST_ENABLED:true}
  fanout:
    push-threshold: 1000        # 大 V 判定：粉丝数阈值
    inbox-max-size: 2000        # 收件箱 LTRIM 定长
    inbox-read-size: 500        # 首屏读取条数
    outbox-retain-days: 7       # 大 V outbox 保留天数
    inactive-days: 7            # 活跃度分层：N 日未登录跳过推送
  counter:
    bucket-count: 64            # 热点计数分桶数
    batch-flush-interval-ms: 2000  # 批量落库周期
  hotspot:
    window-seconds: 10          # 滑动窗口长度
    hot-threshold: 1000         # 热 Key 判定阈值（窗口内访问次数）
    l1-ttl-seconds: 3           # L1 本地缓存 TTL

# Sentinel：默认本地 JSON 规则（克隆即跑），可选 Nacos push
