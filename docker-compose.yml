# =============================================================================
# turbo-feed 全栈编排（开发 / 演示用）
#
# 用法：
#   1) cp .env.example .env          # 填入密钥（JWT_SECRET / 内部令牌 / MinIO 凭据等），并把 .env 加入 .gitignore
#   2) docker compose up -d          # 不含 RocketMQ（应用默认 mq.enabled=false，不依赖 MQ）
#   3) docker compose --profile mq up -d   # 额外拉起 RocketMQ（还需把各服务 TURBOFEED_MQ_ENABLED 改 true 才会真正使用）
#
# 设计要点：
#   - 三服务镜像由本仓库 Dockerfile 多阶段构建（build.args.MODULE 指定子模块）。
#   - 所有凭据 / 中间件地址经环境变量注入；仓库默认配置不出现任何字面量（与代码纪律一致）。
#   - 依赖拓扑：tf-gateway → mysql + redis + minio(+minio-init)；tf-feed-engine → redis + tf-gateway；
#     tf-counter 无外部依赖（H2 内存库，已排除 Redisson）。
#   - 服务间调用：网关 TURBOFEED_FEED_ENGINE_BASE_URL=http://tf-feed-engine:8083，
#     引擎 TURBOFEED_GATEWAY_BASE_URL=http://tf-gateway:8080（compose 内 DNS 即服务名）。
#   - RocketMQ 沿用原独立编排的配置（5.3.1 / container_name tf-rocketmq-* / brokerIP1=127.0.0.1），
#     仅收入 mq profile，避免无 MQ 时也不影响「克隆即跑」。
# =============================================================================
services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${TURBOFEED_DB_PASSWORD:?请在 .env 中设置 TURBOFEED_DB_PASSWORD，MySQL root 口令不再提供 root 兜底}
      MYSQL_DATABASE: turbo_feed_1
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      # 00-create-databases.sql 建逻辑库；01-init-local.sql 灌全量 base schema（全限定建表，无需 USE）
      - ./deploy/compose/mysql/00-create-databases.sql:/docker-entrypoint-initdb.d/00-create-databases.sql:ro
      - ./deploy/mysql/init-local.sql:/docker-entrypoint-initdb.d/01-init-local.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${TURBOFEED_DB_PASSWORD:?请在 .env 中设置 TURBOFEED_DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # A8 核实结论：redis:7-alpine 默认【不开 AOF】，且未挂数据卷 →
    # 容器删除 / 重建后 Redis 数据全部丢失。而本项目 Redis 不只是缓存：
    #   ① 令牌黑名单（登出 / 风控踢人 / 盗号止损的权威）
    #   ② 会话级最近互动序列、用户兴趣画像
    #   ③ 点赞 / 评论计数（Redis 为权威计数源）
    # 丢了不会报错，只表现为「已登出的令牌又能用」「计数归零」，属静默故障。
    # 故显式开启 AOF 并挂数据卷；演示栈重启后状态可恢复。
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${TURBOFEED_MINIO_ACCESS_KEY:?请在 .env 中设置 TURBOFEED_MINIO_ACCESS_KEY，不再提供 minioadmin 兜底}
      MINIO_ROOT_PASSWORD: ${TURBOFEED_MINIO_SECRET_KEY:?请在 .env 中设置 TURBOFEED_MINIO_SECRET_KEY，不再提供 minioadmin 兜底}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 首次启动为 MinIO 建桶 turbo-feed-media（应用侧写入时也会惰性建桶，这里确保预存在）
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/turbo-feed-media || true
      "
    environment:
      MINIO_ROOT_USER: ${TURBOFEED_MINIO_ACCESS_KEY:?请在 .env 中设置 TURBOFEED_MINIO_ACCESS_KEY，不再提供 minioadmin 兜底}
      MINIO_ROOT_PASSWORD: ${TURBOFEED_MINIO_SECRET_KEY:?请在 .env 中设置 TURBOFEED_MINIO_SECRET_KEY，不再提供 minioadmin 兜底}

  # ---- 可选消息总线（默认不启用，--profile mq 才拉起；沿用原独立编排配置）----
  namesrv:
    image: apache/rocketmq:5.3.1
    container_name: tf-rocketmq-namesrv
    profiles: ["mq"]
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    healthcheck:
      test: ["CMD", "sh", "-c", "echo > /dev/tcp/127.0.0.1/9876"]
      interval: 5s
      timeout: 3s
      retries: 10

  broker:
    image: apache/rocketmq:5.3.1
    container_name: tf-rocketmq-broker
    profiles: ["mq"]
    # 不挂载 broker.conf：macOS + D 盘 SMB 挂载时 Docker Desktop 默认不共享 /Volumes，
    # bind mount 会失败。改为命令行参数传关键项，避免文件共享授权麻烦。
    # autoCreateTopicEnable=true：首次发送 turbofeed-media-uploaded 自动建主题。
    # brokerIP1=127.0.0.1：Broker 向 NameServer 注册用本机回环，网关经 127.0.0.1:10911
    #   端口映射回容器，单容器场景链路打通。
    command: sh mqbroker -n namesrv:9876 autoCreateTopicEnable=true brokerIP1=127.0.0.1
    depends_on:
      namesrv:
        condition: service_healthy
    ports:
      - "10909:10909"   # fastListenPort（5.x fast remoting，可选）
      - "10911:10911"   # 主 remoting listenPort（spring-boot-starter 2.3.5 客户端连这个）
      - "10912:10912"   # haListenPort（可选）
    environment:
      # RocketMQ 镜像默认 JAVA_OPT 偏省，单机开发给足堆，避免 Broker 启动 OOM
      JAVA_OPT: "-server -Xms512m -Xmx512m -Xmn256m"
    healthcheck:
      test: ["CMD", "sh", "-c", "echo > /dev/tcp/127.0.0.1/10911"]
      interval: 5s
      timeout: 3s
      retries: 15

  # ---- 三服务 ----
  tf-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: tf-gateway
    environment:
      SERVER_PORT: "8080"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # Redis 拓扑：默认 single（本地/演示）。生产启用 HA 时由环境变量整体切换为 cluster / sentinel，
      # 无需改镜像或代码——拓扑装配见 tf-redis 的 RedisTopologyConfig / RedissonTopologyConfig。
      TURBOFEED_REDIS_MODE: ${TURBOFEED_REDIS_MODE:-single}
      TURBOFEED_REDIS_CLUSTER_NODES: ${TURBOFEED_REDIS_CLUSTER_NODES:-}
      TURBOFEED_REDIS_PASSWORD: ${TURBOFEED_REDIS_PASSWORD:-}
      # ShardingSphere 逻辑库数据源（网关）；副本库指向同一实例，避免无副本时读失败
      TURBOFEED_DB_0_URL: jdbc:mysql://mysql:3306/turbo_feed_1?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      TURBOFEED_DB_1_URL: jdbc:mysql://mysql:3306/turbo_feed_2?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      TURBOFEED_REPLICA_DB_0_URL: jdbc:mysql://mysql:3306/turbo_feed_1?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      TURBOFEED_REPLICA_DB_1_URL: jdbc:mysql://mysql:3306/turbo_feed_2?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      TURBOFEED_DB_USERNAME: ${TURBOFEED_DB_USERNAME:?请在 .env 中设置 TURBOFEED_DB_USERNAME}
      TURBOFEED_DB_PASSWORD: ${TURBOFEED_DB_PASSWORD:?请在 .env 中设置 TURBOFEED_DB_PASSWORD}
      TURBOFEED_JWT_SECRET: ${TURBOFEED_JWT_SECRET}
      TURBOFEED_SNOWFLAKE_WORKER_ID: ${TURBOFEED_SNOWFLAKE_WORKER_ID:-1}
      TURBOFEED_SNOWFLAKE_DATACENTER_ID: ${TURBOFEED_SNOWFLAKE_DATACENTER_ID:-1}
      TURBOFEED_FEED_ENGINE_BASE_URL: http://tf-feed-engine:8083
      TURBOFEED_FEED_DEGRADED_MODE: empty
      TURBOFEED_MINIO_ENDPOINT: http://minio:9000
      TURBOFEED_MINIO_ACCESS_KEY: ${TURBOFEED_MINIO_ACCESS_KEY:?请在 .env 中设置 TURBOFEED_MINIO_ACCESS_KEY}
      TURBOFEED_MINIO_SECRET_KEY: ${TURBOFEED_MINIO_SECRET_KEY:?请在 .env 中设置 TURBOFEED_MINIO_SECRET_KEY}
      TURBOFEED_MEDIA_PUBLIC_URL_BASE: http://minio:9000/turbo-feed-media/
      TURBOFEED_INTERNAL_TOKEN: ${TURBOFEED_INTERNAL_TOKEN:?请在 .env 中设置 TURBOFEED_INTERNAL_TOKEN，网关与引擎必须同值}
      TURBOFEED_MQ_ENABLED: "false"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 15

  tf-feed-engine:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: tf-feed-engine
    environment:
      SERVER_PORT: "8083"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # Redis 拓扑：默认 single（本地/演示）。生产启用 HA 时由环境变量整体切换为 cluster / sentinel。
      TURBOFEED_REDIS_MODE: ${TURBOFEED_REDIS_MODE:-single}
      TURBOFEED_REDIS_CLUSTER_NODES: ${TURBOFEED_REDIS_CLUSTER_NODES:-}
      TURBOFEED_REDIS_PASSWORD: ${TURBOFEED_REDIS_PASSWORD:-}
      TURBOFEED_GATEWAY_BASE_URL: http://tf-gateway:8080
      TURBOFEED_INTERNAL_TOKEN: ${TURBOFEED_INTERNAL_TOKEN:?请在 .env 中设置 TURBOFEED_INTERNAL_TOKEN，网关与引擎必须同值}
      TURBOFEED_MQ_ENABLED: "false"
      # 行为明细落盘（推荐训练样本的来源）。默认关：本地开发不该静默写文件。
      # ⚠️ 变量名必须带 FEED：属性是 turbofeed.feed.behavior-log.enabled，
      #    写成 TURBOFEED_BEHAVIOR_LOG_ENABLED 会被 Spring 静默忽略（不报错、读到默认 false）。
      TURBOFEED_FEED_BEHAVIOR_LOG_ENABLED: ${TURBOFEED_FEED_BEHAVIOR_LOG_ENABLED:-false}
      TURBOFEED_FEED_BEHAVIOR_LOG_DIR: /app/logs/behavior
    ports:
      - "8083:8083"
    volumes:
      # 行为明细落命名卷：容器重建 / 重建镜像都不丢。
      # 不挂卷时数据只存在容器可写层，`docker compose down` 即永久丢失——
      # 这正是「开关打开了但数据没攒住」的根因。
      - behavior-logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      tf-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 15

  tf-counter:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: tf-counter
    environment:
      SERVER_PORT: "8081"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 15

volumes:
  mysql-data:
  redis-data:
  minio-data:
  # 行为明细（behavior-log）持久卷。按天分文件的 JSONL，后续由采集侧导入对象存储/数仓。
  behavior-logs:
