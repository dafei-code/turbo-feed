# tf-feed-engine 服务配置骨架（参数随实现逐模块填充）
spring:
  application:
    name: tf-feed-engine

  # Redis（Lettuce，懒连接）：Feed 时间线读模型与推荐流旁路缓存的宿主
  #   · tf:feed:tl:{pool}:{yyyyMMdd}  —— 公域时间线分桶 ZSET（score = 入流时刻毫秒）
  #   · tf:feed:idx:{mediaId}         —— 反查索引（精确 ZREM 下架，摆脱桶内扫描）
  #   · tf:feed:rec:{page}:{size}     —— 推荐流旁路缓存（TTL 15s）
  # 本地未启动 Redis 不影响应用启动（Lettuce 懒建连）；/actuator/health 的 redis 组件会显示
  # DOWN，故下方 management.health.redis.enabled=false 保证整体健康状态不被拉低（克隆即跑）。
  data:
    redis:
      host: localhost
      port: 6379
      # 密码外部化：默认空串 = 无密码（受网络隔离保护的 Redis 的常见形态）。
      # 启用带密码的 Redis 时用环境变量注入，绝不把真实密码写进提交到仓库的默认配置。
      # 未注入而 Redis 实际要求鉴权时，命令会直接返回 NOAUTH Authentication required
      # （写路径 fail-open 只告警；B2 顺序消费路径会抛异常 → 进重试/DLQ，不会静默丢）。
      password: ${TURBOFEED_REDIS_PASSWORD:}
      timeout: 500ms
      lettuce:
        pool:
          # Feed 读取是「高扇出、小报文」型负载，连接池主要吸收突发并发；写入侧（审核发布）
          # 为低频命令。依赖 commons-pool2（lettuce-core 的 optional 依赖不传递，
          # 已在 tf-feed-engine pom 显式声明）。
          enabled: true
          max-active: 32        # 最大连接数（并发上限，读多写少故高于网关）
          max-idle: 16          # 最大空闲连接
          min-idle: 2           # 最小空闲连接（预热，避免冷启动建连抖动）
          max-wait: 1000ms      # 获取连接最大等待（超时即失败，快速失败而非线程堆积）
        shutdown-timeout: 100ms
      # ⚠️ 不要在这里写 cluster.nodes / sentinel：拓扑切换统一走下面的 turbofeed.redis.mode，
      # 由 tf-redis 模块的 RedisTopologyConfig 装配（与 tf-gateway 同一份实现、同一套属性）。
      # 这里只保留单机默认值（host/port），保证「克隆即跑」。

server:
  port: 8083

management:
  # Redis 未就绪前关闭其健康指示器，避免 /actuator/health 整体被拉成 DOWN（克隆即跑）；
  # 本地启动 Redis 后改为 true（或直接删除此段）
  health:
    redis:
      enabled: false
  # 健康检查仅暴露基础端点（K8s 探活）；接 Prometheus 时再开放 prometheus 端点
  endpoints:
    web:
      exposure:
        include: health,info

turbofeed:
  # Redis 拓扑开关（与 tf-gateway 完全同名同义，实现来自 tf-redis 模块）：
  #   single（默认）  —— 用上面 spring.data.redis.host/port，tf-redis 不注册任何 Bean，克隆即跑
  #   cluster        —— 必须给 cluster-nodes（逗号分隔 host:port，只给部分节点也能自动发现其余）
  #   sentinel       —— 必须给 sentinel-master + sentinel-nodes
  # ⚠️ 0044 切集群时本模块因缺少这段配置仍连已下线的单机 6379，导致时间线读写静默失败、
  #    推荐流全空。切换拓扑时**两个服务必须一起改**，这是把它们收进 tf-redis 的原因。
  redis:
    mode: ${TURBOFEED_REDIS_MODE:single}
    cluster-nodes: ${TURBOFEED_REDIS_CLUSTER_NODES:}
    sentinel-master: ${TURBOFEED_REDIS_SENTINEL_MASTER:}
    sentinel-nodes: ${TURBOFEED_REDIS_SENTINEL_NODES:}
    max-redirects: 3
  # Feed 时间线投递开关：默认 false（走同步 HTTP 兜底，克隆即跑）。
  # 启用真 MQ 需同时激活 application-mq.yml（--spring.profiles.active=mq），
  # 否则 FeedTimelineConsumer / RocketMqFeedTimelinePublisher 不装配。
  mq:
    enabled: ${TURBOFEED_MQ_ENABLED:false}
  feed:
    timeline:
      # Feed 时间线事件 Topic 与消费组（append / remove 共用，靠 body.action 区分，保证同一 mediaId 顺序）
      topic: turbofeed-feed-timeline
      consumer-group: turbofeed-feed-timeline-group
    # 多路召回的每页槽位预算（均从单页 limit 里切，剩余归流量池）
    #   hot-recall-ratio      热点位：全站探索（人人相似）
    #   interest-recall-ratio 兴趣位：按用户兴趣标签召回（因人而异）
    hot-recall-ratio: ${TURBOFEED_FEED_HOT_RECALL_RATIO:0.1}
    interest-recall-ratio: ${TURBOFEED_FEED_INTEREST_RECALL_RATIO:0.15}
    # 关注流召回占每页槽位比例（抖音式「关注流 / 社交分发」G6）：关注作者近期已审内容混入发现流
    follow-recall-ratio: ${TURBOFEED_FEED_FOLLOW_RECALL_RATIO:0.1}
    # 生态调控层（G9 抖音式「生态调控」）：对流量池主内容源施加整页全局占比配额，
    # 防止单一话题/作者垄断整页（与 G8 滑窗重排互补：G8=局部窗、G9=整页全局）
    ecosystem:
      enabled: ${TURBOFEED_FEED_ECOSYSTEM_ENABLED:true}
      max-tag-share: ${TURBOFEED_FEED_ECOSYSTEM_MAX_TAG_SHARE:0.35}
      max-author-share: ${TURBOFEED_FEED_ECOSYSTEM_MAX_AUTHOR_SHARE:3}
    # 兴趣画像的完播加权（观看进度是连续信号，不该压成固定权重）
    interest:
      watch-skip-ratio: 0.3        # 低于该观看比例 = 划走，不计画像（划走不表达兴趣）
      watch-partial-weight: 0.1    # 看一半：弱信号
      watch-complete-weight: 0.3   # 看完：强信号（与 PostStatService 完播阈值 0.7 同口径）
      play-complete-weight: 0.3    # 旧端二进制完播事件，等同看完档
      # 时间衰减：不衰减的累计和会让"三年前的兴趣"永远压过"现在的兴趣"
      half-life-days: 14           # 半衰期：14 天前的同量权重只剩一半
      min-score: 0.01              # 衰减到该绝对值以下 = 遗忘，标签移出画像
      # 长短期双层画像（抖音式分层）：长期层定"你是什么样的人"，短期层定"你现在想要什么"
      short-term:
        enabled: true              # 关闭后退化为单层（仅用长期层）
        half-life-hours: 12        # 短期半衰期：半天不碰，这次突发兴趣衰减一半
        long-weight: 1.0           # 融合排序时长期层的相对权重
        short-weight: 2.0          # 融合排序时短期层的相对权重（>long 表示更看重最近）
    # session 级行为序列（抖音式"刚看过的再多给"的精排信号源）
    session:
      enabled: true                # 关闭后退化无 session 信号，精排回到纯画像+统计
      max: 30                       # 序列窗口保留的最大互动条数
      ttl-minutes: 120             # 整份序列 TTL（用户停手这么久即清掉）
      half-life-minutes: 30        # 序列内单条互动的 recency 半衰期（越久影响越小）
    # 精排打分（RankingModel）权重；全部带默认值，不强制改
    rank:
      completion-weight: 0.15        # 完播率目标权重
      interaction-weight: 0.20       # 互动率目标权重（点赞/评论/分享，抖音式"互动即优质"）
      interest-weight: 1.0          # 长期兴趣匹配权重
      short-term-weight: 1.0        # 短期兴趣匹配权重（调大=更跟手、更看重最近行为）
      session-weight: 0.5           # session 序列匹配权重（调大=更强的即时跟随）
      interest-score-cap: 3.0       # 长期兴趣累加分上限
      short-term-score-cap: 3.0     # 短期兴趣累加分上限
      session-score-cap: 3.0        # session 序列匹配分上限
      completion-prior-count: 20     # 完播率贝叶斯平滑：虚拟曝光数
      completion-prior-rate: 0.20    # 完播率先验水平
      interaction-prior-count: 20
      interaction-prior-rate: 0.05
      negative-penalty-millis: 2592000000   # 命中负向标签惩罚（30 天毫秒，远大于窗口）
      recency-window-millis: 3600000  # 比率目标折算成等效入流时刻的窗口（1 小时）
    # M0 行为明细落盘（训练样本的唯一来源；实现见 logging.BehaviorLogSink）
    # ⚠️ 默认 false：落盘是"为了攒数据"的行为，不该在任何人的机器上静默写文件。
    #    需要采集时显式置 true，并自行负责磁盘占用与清理。
    behavior-log:
      enabled: ${TURBOFEED_BEHAVIOR_LOG_ENABLED:false}
      # 落盘目录（相对进程工作目录；文件名为 feed-behavior-{yyyyMMdd}.jsonl）
      dir: ${TURBOFEED_BEHAVIOR_LOG_DIR:logs/behavior}
      # 异步队列容量：满了直接丢弃并计数（埋点丢得起，请求卡不起）
      queue-capacity: 10000
      flush-interval-millis: 1000
  # 网关地址（引擎晋级回调「流量池分级」加严复审用，changelog 0067）。默认直连本地 8080。
  # 引入 Nacos 服务发现 + LoadBalancer 后，此项退化兜底/调试用（与 turbofeed.feed.engine 同构）。
  gateway:
    base-url: ${TURBOFEED_GATEWAY_BASE_URL:http://localhost:8080}
    # 同步调用必须设超时（毫秒）：网关故障时若无限等待，扫描线程会被慢调用拖垮（雪崩入口）
    connect-timeout-ms: 500
    read-timeout-ms: 2000
