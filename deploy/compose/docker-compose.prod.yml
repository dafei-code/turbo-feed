# =============================================================================
# turbo-feed 生产形态编排（自包含，不依赖根目录 docker-compose.yml）
#
# 用法：
#   cp deploy/env/.env.example deploy/env/.env      # 填真实值，.env 不入仓库
#   bash deploy/scripts/preflight.sh deploy/env/.env # 启动前校验
#   docker compose -f deploy/compose/docker-compose.prod.yml --env-file deploy/env/.env up -d
#
# ── 为什么另起一个文件而不是写 override ──────────────────────────────────────
#   Compose 合并多文件时，`ports` / `volumes` 这类列表是**追加**而不是替换。
#   想让生产「不暴露中间件端口」必须写 `ports: !reset []`，而该标签要求 Compose ≥ 2.24，
#   降级到老版本会静默失效——端口照样暴露，且没有任何报错。自包含文件没有这个语义陷阱。
#
# ── 与开发编排（根目录 docker-compose.yml）的差异 ────────────────────────────
#   1. **端口收敛**：只有网关对宿主发布端口；MySQL / Redis / MinIO / engine / counter
#      一律只在内部网络可达。开发编排为了本机连库方便把它们全暴露了，生产不该这样。
#   2. **重启策略**：一律 `unless-stopped`，宿主机重启或进程崩溃能自愈。
#   3. **资源限制**：没有限额时，一个服务的堆膨胀会拖垮整台机器（尤其 JVM 按宿主机算堆）。
#   4. **日志轮转**：json-file 默认无上限，跑久了能把磁盘写满（这是个真实且高频的故障）。
#   5. **行为明细持久卷**：behavior-logs 挂在引擎上，容器重建不丢训练样本。
#
# ── 仍然没有的东西（别误以为这套就等于可上线）─────────────────────────────────
#   - 没有 TLS 终结 / 反向代理（网关裸 HTTP，生产必须前置 Nginx/Traefik/云 LB）
#   - 没有密钥管理（.env 是明文文件；生产应走 KMS / Vault / K8s Secret）
#   - 没有备份与恢复演练、没有灰度与回滚
#   - 单机 compose 无跨节点容灾；真要高可用需上 K8s 或至少多节点 + 外部中间件
# =============================================================================
name: turbo-feed

services:
  # ───────────────────────────── 中间件 ─────────────────────────────
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${TURBOFEED_DB_PASSWORD:?请在 deploy/env/.env 中设置 TURBOFEED_DB_PASSWORD}
      MYSQL_DATABASE: turbo_feed_1
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # 挂目录而非单文件：新增的 01-counter-shared-db.sql 会按文件名顺序一并执行
      # （tf-counter 生产共享库）。⚠️ initdb 只在【空数据卷】首次初始化时跑，
      # 已有环境需手工补跑该脚本，重启容器不会自动建表。
      - ./mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${TURBOFEED_DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF 必须开：Redis 在本项目里不只是缓存——令牌黑名单、点赞计数、关注关系都以它为权威源。
    # 丢了不报错，只表现为「已登出的令牌又能用」「计数归零」，属静默故障。
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${TURBOFEED_MINIO_ACCESS_KEY:?请在 deploy/env/.env 中设置 TURBOFEED_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${TURBOFEED_MINIO_SECRET_KEY:?请在 deploy/env/.env 中设置 TURBOFEED_MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G

  minio-init:
    image: minio/mc
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/turbo-feed-media || true
      "
    environment:
      MINIO_ROOT_USER: ${TURBOFEED_MINIO_ACCESS_KEY:?请在 deploy/env/.env 中设置 TURBOFEED_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${TURBOFEED_MINIO_SECRET_KEY:?请在 deploy/env/.env 中设置 TURBOFEED_MINIO_SECRET_KEY}

  # ───────────────────────────── 应用服务 ─────────────────────────────
  tf-gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        MODULE: tf-gateway
    image: turbo-feed-gateway:${TURBOFEED_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: ${TURBOFEED_SPRING_PROFILES:-prod}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # 生产默认走集群（compose 的默认值是 single，那是给本地开发用的）。
      # 真正的三主三从拓扑见 deploy/redis/docker-compose-cluster.yml。
      TURBOFEED_REDIS_MODE: ${TURBOFEED_REDIS_MODE:-cluster}
      TURBOFEED_REDIS_CLUSTER_NODES: ${TURBOFEED_REDIS_CLUSTER_NODES:?请设置集群节点列表，如 redis-0:7000,redis-1:7000,...}
      TURBOFEED_REDIS_PASSWORD: ${TURBOFEED_REDIS_PASSWORD:?请在 deploy/env/.env 中设置 TURBOFEED_REDIS_PASSWORD}
      TURBOFEED_DB_0_URL: jdbc:mysql://mysql:3306/turbo_feed_1?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      TURBOFEED_DB_1_URL: jdbc:mysql://mysql:3306/turbo_feed_2?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      # 评审优化项④：读写分离副本地址参数化。规则本身早已在
      # shardingsphere-config-128.yaml 里配好（!READWRITE_SPLITTING），缺的是部署侧真实副本 URL。
      # 默认仍回落主库 mysql:3306：未部署副本时读路径照常可用（等价于「读写分离规则存在但读主」），
      # 不会像直配 3307 那样因副本不存在而全量读失败（见 docs/changelog/0051）。
      # 有真实只读副本时在 deploy/env/.env 里显式覆盖这两个变量即可，无需改镜像。
      TURBOFEED_REPLICA_DB_0_URL: ${TURBOFEED_REPLICA_DB_0_URL:-jdbc:mysql://mysql:3306/turbo_feed_1?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
      TURBOFEED_REPLICA_DB_1_URL: ${TURBOFEED_REPLICA_DB_1_URL:-jdbc:mysql://mysql:3306/turbo_feed_2?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
      TURBOFEED_DB_USERNAME: ${TURBOFEED_DB_USERNAME:?请在 deploy/env/.env 中设置 TURBOFEED_DB_USERNAME}
      TURBOFEED_DB_PASSWORD: ${TURBOFEED_DB_PASSWORD:?请在 deploy/env/.env 中设置 TURBOFEED_DB_PASSWORD}
      # prod profile 要求 JWT_SECRET 至少 32 字符（HS256 密钥强度），缺失则启动失败
      TURBOFEED_JWT_SECRET: ${TURBOFEED_JWT_SECRET:?请在 deploy/env/.env 中设置 TURBOFEED_JWT_SECRET}
      TURBOFEED_SNOWFLAKE_WORKER_ID: ${TURBOFEED_SNOWFLAKE_WORKER_ID:-1}
      TURBOFEED_SNOWFLAKE_DATACENTER_ID: ${TURBOFEED_SNOWFLAKE_DATACENTER_ID:-1}
      TURBOFEED_FEED_ENGINE_BASE_URL: http://tf-feed-engine:8083
      TURBOFEED_MINIO_ENDPOINT: http://minio:9000
      TURBOFEED_MINIO_ACCESS_KEY: ${TURBOFEED_MINIO_ACCESS_KEY:?请在 deploy/env/.env 中设置 TURBOFEED_MINIO_ACCESS_KEY}
      TURBOFEED_MINIO_SECRET_KEY: ${TURBOFEED_MINIO_SECRET_KEY:?请在 deploy/env/.env 中设置 TURBOFEED_MINIO_SECRET_KEY}
      TURBOFEED_MEDIA_PUBLIC_URL_BASE: ${TURBOFEED_MEDIA_PUBLIC_URL_BASE:?生产必须是外部可达的 URL 前缀}
      # 网关与引擎必须同值；prod profile 无默认值，缺失直接启动失败（fail-fast）
      TURBOFEED_INTERNAL_TOKEN: ${TURBOFEED_INTERNAL_TOKEN:?请在 deploy/env/.env 中设置 TURBOFEED_INTERNAL_TOKEN}
      TURBOFEED_MQ_ENABLED: ${TURBOFEED_MQ_ENABLED:-false}
      # 突发档（prod,mq）专用：compose environment 是白名单，不显式转发则
      # application-mq.yml 的 ${TURBOFEED_ROCKETMQ_NAME_SERVER} 永远取默认值。
      TURBOFEED_ROCKETMQ_NAME_SERVER: ${TURBOFEED_ROCKETMQ_NAME_SERVER:-127.0.0.1:9876}
      # MQ 发送失败时的 HTTP 直投兜底目标：容器内必须指向 tf-counter 服务名，
      # 否则会落到 yml 默认 localhost:8081（网关容器自己），兜底永远失败。
      TURBOFEED_COUNTER_BASE_URL: ${TURBOFEED_COUNTER_BASE_URL:-http://tf-counter:8081}
      # ── 阶段 B1 多副本开关（默认全关，注入才生效）─────────────────────────
      # compose 的 environment: 是白名单，未显式列出的变量进不了容器（历史坑：
      # TURBOFEED_BEHAVIOR_LOG_ENABLED 设了却静默按默认值走）。
      TURBOFEED_REDIS_REDISSON_ENABLED: ${TURBOFEED_REDIS_REDISSON_ENABLED:-false}
      TURBOFEED_SNOWFLAKE_LEASE_ENABLED: ${TURBOFEED_SNOWFLAKE_LEASE_ENABLED:-false}
      TURBOFEED_COUNTER_ENABLED: ${TURBOFEED_COUNTER_ENABLED:-false}
      # 阶段 B2：词库/白名单跨实例 epoch 广播（默认关；不注入时各实例走 30s 指纹刷新）
      TURBOFEED_CONTENT_SECURITY_EPOCH_BROADCAST_ENABLED: ${TURBOFEED_CONTENT_SECURITY_EPOCH_BROADCAST_ENABLED:-false}
      # 评审优化项③：热点计数 Key 分槽（默认关；开启前务必读 docs/ops/hotspot-count-sharding.md
      # 的读放大与回退步骤，compose environment 是白名单，未转发则设了也不生效）
      TURBOFEED_LIKE_COUNT_SHARDING_ENABLED: ${TURBOFEED_LIKE_COUNT_SHARDING_ENABLED:-false}
      # 评审优化项④：评论列表页短 TTL 缓存（默认关）。compose environment 是白名单，
      # 不显式转发则 application.yml 的占位符永远取默认值，设了也不生效。
      TURBOFEED_COMMENT_PAGE_CACHE_ENABLED: ${TURBOFEED_COMMENT_PAGE_CACHE_ENABLED:-false}
      TURBOFEED_COMMENT_PAGE_CACHE_TTL_MS: ${TURBOFEED_COMMENT_PAGE_CACHE_TTL_MS:-2000}
      # PR-B/PR-D2：上传链路 MEDIA_UPLOADED 走发件箱（默认关，关时仍走原直发路径）。
      # PR-D5：发件箱传输通道；留空 = 跟随 TURBOFEED_MQ_ENABLED，显式 local / mq 才覆盖。
      # compose environment 是白名单，未转发则 application.yml 占位符永远取默认值。
      TURBOFEED_OUTBOX_MEDIA_UPLOADED_ENABLED: ${TURBOFEED_OUTBOX_MEDIA_UPLOADED_ENABLED:-false}
      TURBOFEED_OUTBOX_CHANNEL_DEFAULT: ${TURBOFEED_OUTBOX_CHANNEL_DEFAULT:-}
      TURBOFEED_OUTBOX_CHANNEL_MEDIA_UPLOADED: ${TURBOFEED_OUTBOX_CHANNEL_MEDIA_UPLOADED:-}
    ports:
      # 唯一对宿主发布的端口。裸 HTTP——生产必须在前面放 TLS 终结（Nginx/Traefik/云 LB）。
      - "${TURBOFEED_GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2G

  tf-feed-engine:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        MODULE: tf-feed-engine
    image: turbo-feed-engine:${TURBOFEED_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SERVER_PORT: "8083"
      SPRING_PROFILES_ACTIVE: ${TURBOFEED_SPRING_PROFILES:-prod}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      TURBOFEED_REDIS_MODE: ${TURBOFEED_REDIS_MODE:-cluster}
      TURBOFEED_REDIS_CLUSTER_NODES: ${TURBOFEED_REDIS_CLUSTER_NODES:?请设置集群节点列表}
      TURBOFEED_REDIS_PASSWORD: ${TURBOFEED_REDIS_PASSWORD:?请在 deploy/env/.env 中设置 TURBOFEED_REDIS_PASSWORD}
      TURBOFEED_GATEWAY_BASE_URL: http://tf-gateway:8080
      TURBOFEED_INTERNAL_TOKEN: ${TURBOFEED_INTERNAL_TOKEN:?请在 deploy/env/.env 中设置 TURBOFEED_INTERNAL_TOKEN}
      TURBOFEED_MQ_ENABLED: ${TURBOFEED_MQ_ENABLED:-false}
      # 突发档（prod,mq）专用：engine 的 application-mq.yml 同样读这个变量名
      TURBOFEED_ROCKETMQ_NAME_SERVER: ${TURBOFEED_ROCKETMQ_NAME_SERVER:-127.0.0.1:9876}
      # ── 行为明细（推荐训练样本）───────────────────────────────────────
      # ⚠️ 变量名必须带 FEED：不是 Spring 不认（yaml 里还有 ${TURBOFEED_BEHAVIOR_LOG_ENABLED} 兜底），
      #    而是**本文件只把带 FEED 的这个名字转发进容器**——不带 FEED 的变量进不去，
      #    表现为「开关设了、日志没异常、数据一条没有」。
      TURBOFEED_FEED_BEHAVIOR_LOG_ENABLED: ${TURBOFEED_FEED_BEHAVIOR_LOG_ENABLED:-true}
      TURBOFEED_FEED_BEHAVIOR_LOG_DIR: /app/logs/behavior
      TURBOFEED_FEED_BEHAVIOR_LOG_QUEUE_CAPACITY: ${TURBOFEED_FEED_BEHAVIOR_LOG_QUEUE_CAPACITY:-50000}
      # ── P1 行为明细归档到 MinIO（与上面落盘配套：不归档则数据只在单机卷里，磁盘故障即全失）──
      # 归档的变量名同样必须带 BEHAVIOR_LOG：本文件只转发带此前缀的名字进容器。
      # 默认关闭（false）：生产需在 .env 显式置 true 才生效；归档目标端点用内部 minio 服务名。
      TURBOFEED_BEHAVIOR_LOG_ARCHIVE_ENABLED: ${TURBOFEED_BEHAVIOR_LOG_ARCHIVE_ENABLED:-false}
      TURBOFEED_BEHAVIOR_LOG_ARCHIVE_MINIO_ENDPOINT: http://minio:9000
      TURBOFEED_BEHAVIOR_LOG_ARCHIVE_MINIO_ACCESS_KEY: ${TURBOFEED_MINIO_ACCESS_KEY:?请在 deploy/env/.env 中设置 TURBOFEED_MINIO_ACCESS_KEY}
      TURBOFEED_BEHAVIOR_LOG_ARCHIVE_MINIO_SECRET_KEY: ${TURBOFEED_MINIO_SECRET_KEY:?请在 deploy/env/.env 中设置 TURBOFEED_MINIO_SECRET_KEY}
      TURBOFEED_BEHAVIOR_LOG_ARCHIVE_BUCKET: ${TURBOFEED_BEHAVIOR_LOG_ARCHIVE_BUCKET:-turbo-feed}
      TURBOFEED_BEHAVIOR_LOG_ARCHIVE_BASE_KEY_PREFIX: ${TURBOFEED_BEHAVIOR_LOG_ARCHIVE_BASE_KEY_PREFIX:-behavior}
      TURBOFEED_BEHAVIOR_LOG_ARCHIVE_LOCAL_RETENTION_HOURS: ${TURBOFEED_BEHAVIOR_LOG_ARCHIVE_LOCAL_RETENTION_HOURS:-168}
      # 阶段 B1：Redisson 客户端开关（与网关 / counter 同一 tf-redis 装配口径）
      TURBOFEED_REDIS_REDISSON_ENABLED: ${TURBOFEED_REDIS_REDISSON_ENABLED:-false}
      # PR-D3：时间线墓碑防旧（引擎侧）。默认 true —— 存量事件无 occurredAt 天然放行，
      # 零回归不靠默认关；只有显式设 false 才整体回退。compose environment 是白名单，
      # 不转发则 yaml 占位符永远取默认值，回退开关会静默失效。
      TURBOFEED_FEED_TIMELINE_TOMBSTONE_ENABLED: ${TURBOFEED_FEED_TIMELINE_TOMBSTONE_ENABLED:-true}
      TURBOFEED_FEED_TIMELINE_TOMBSTONE_TTL_DAYS: ${TURBOFEED_FEED_TIMELINE_TOMBSTONE_TTL_DAYS:-30}
    # 不发布端口：只在内部网络被网关调用。需要直连排障时临时用 `docker compose exec`。
    volumes:
      - behavior-logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      tf-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2G

  tf-counter:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        MODULE: tf-counter
    image: turbo-feed-counter:${TURBOFEED_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SERVER_PORT: "8081"
      SPRING_PROFILES_ACTIVE: ${TURBOFEED_SPRING_PROFILES:-prod}
      # ── 阶段 B1：共享 MySQL（application-prod.yml）+ Redis 集群 ──────────────
      # 原先本段只有上面两行：prod profile 形同虚设，counter 仍连 127.0.0.1:6379
      # 与 H2 内存库，多副本下 ShedLock 锁 / 计数 / 去重表都不共享。
      TURBOFEED_DB_USERNAME: ${TURBOFEED_DB_USERNAME:?请在 deploy/env/.env 中设置 TURBOFEED_DB_USERNAME}
      TURBOFEED_DB_PASSWORD: ${TURBOFEED_DB_PASSWORD:?请在 deploy/env/.env 中设置 TURBOFEED_DB_PASSWORD}
      TURBOFEED_REDIS_MODE: ${TURBOFEED_REDIS_MODE:-cluster}
      TURBOFEED_REDIS_CLUSTER_NODES: ${TURBOFEED_REDIS_CLUSTER_NODES:?请设置集群节点列表}
      TURBOFEED_REDIS_PASSWORD: ${TURBOFEED_REDIS_PASSWORD:?请在 deploy/env/.env 中设置 TURBOFEED_REDIS_PASSWORD}
      # 三个开关默认全关；组合约束见 FeatureFlagGuard.validateCounterBuffer()
      TURBOFEED_REDIS_REDISSON_ENABLED: ${TURBOFEED_REDIS_REDISSON_ENABLED:-false}
      TURBOFEED_COUNTER_REDIS_ENABLED: ${TURBOFEED_COUNTER_REDIS_ENABLED:-false}
      TURBOFEED_COUNTER_REDIS_BUFFER_ENABLED: ${TURBOFEED_COUNTER_REDIS_BUFFER_ENABLED:-false}
      # ── 突发档（prod,mq）：计数消费者必须与网关同时开 MQ ────────────────────
      # 原先本段完全没有 MQ 变量，CounterMqConsumer 因缺 name-server 静默不注册，
      # 表现为「网关发了 MQ，tf-counter 却一直在等 HTTP」。
      TURBOFEED_MQ_ENABLED: ${TURBOFEED_MQ_ENABLED:-false}
      TURBOFEED_ROCKETMQ_NAME_SERVER: ${TURBOFEED_ROCKETMQ_NAME_SERVER:-127.0.0.1:9876}
    # 共享库必须先就绪，否则 HikariCP 初始化即失败
    depends_on:
      mysql:
        condition: service_healthy
    # 不发布端口：计数服务只被网关/引擎内部调用。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  mysql-data:
  redis-data:
  minio-data:
