# RocketMQ Broker 配置（本地单机开发用）
# 挂载到 apache/rocketmq:5.3.1 容器的
# /home/rocketmq/rocketmq-5.3.1/conf/broker.conf
#
# 关键点：
# - brokerIP1=127.0.0.1：本机单容器场景下，Broker 向 NameServer 注册时用 127.0.0.1，
#   网关（宿主机）拿到地址后访问 127.0.0.1:10911，经 docker 端口映射回 broker 容器，链路打通。
# - autoCreateTopicEnable=true：首次发送 turbofeed-media-uploaded 时自动建主题，免手动 mqadmin。
# - ASYNC_MASTER + ASYNC_FLUSH：本地开发追求一键启动与吞吐，不做强一致（生产另配）。

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
autoCreateTopicEnable = true
brokerIP1 = 127.0.0.1
listenPort = 10911
namesrvAddr = namesrv:9876
