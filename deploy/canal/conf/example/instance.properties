#################################################
## canal instance: turbo-feed outbox_event CDC
## 作用：订阅本机 MySQL(3306) binlog，只过滤 outbox_event 分片表的 INSERT，
##       由转发器转成 {eventId, traceId} 消息写入 RocketMQ Topic turbofeed-outbox-cdc。
## 关联：docs/ops/outbox-cdc-rollout.md、docs/ops/outbox-sharding-rollout.md
#################################################

# slaveId 不能与 MySQL 集群里其他从库/复制账号冲突
canal.instance.mysql.slaveId=654321

# 主库地址：容器连宿主机 MySQL（macOS Docker Desktop 用 host.docker.internal）
canal.instance.master.address=host.docker.internal:3306

# 起始位点：从当前位点启动（存量已迁移，不需要回放历史 binlog）。
# 位点取自建 canal 账号后 SHOW BINARY LOG STATUS 的输出。
canal.instance.master.journal.name=binlog.000286
canal.instance.master.position=289130
canal.instance.master.timestamp=
canal.instance.gtidon=false

# 复制账号（CREATE USER canal@'%'，REPLICATION SLAVE/CLIENT + SELECT）
canal.instance.dbUsername=canal
canal.instance.dbPassword=Canal@123456!

# binlog 过滤：只订阅两库的 outbox_event 单表 + 128 张分片表；其余表忽略，
# 降低 canal 解析与转发压力。正则为 Java 风格，\\. 转义点，.* 匹配分片后缀。
canal.instance.filter.regex=turbo_feed_1\\.outbox_event.*,turbo_feed_2\\.outbox_event.*
# 黑名单：明确排除备份表（若存在），防止把回滚备份表的行当事件投递
canal.instance.filter.black.regex=turbo_feed_1\\.outbox_event_backup.*

# 表字段解析：ROW 模式默认开启；transient 类型不解析
canal.instance.parser.parallelThreadSize=2

# mq 相关配置由转发器负责（canal 原生 MQ 直投暂不启用，先由独立转发器消费 canal entry）
