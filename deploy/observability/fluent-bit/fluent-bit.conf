# =============================================================================
# 采集 Docker json-file → Loki
#
# 数据形状（prod profile 下）：
#   /var/lib/docker/containers/<id>/<id>-json.log 每行是
#     {"log":"{\"@timestamp\":\"...\",\"service\":\"tf-gateway\",\"level\":\"INFO\",
#       \"traceId\":\"...\",\"message\":\"...\"}","stream":"stdout","time":"..."}
#   → [INPUT] 的 docker_json parser 拆外层 → [FILTER] 的 app_json parser 拆里层
#   → record 顶层出现 service / level / traceId / message，Loki output 才能按它们建 label。
#
# 为什么解析两次：Docker 把应用 stdout 当成字符串塞进 log 字段，不是嵌套对象。
# 只解析外层的话，service 永远取不到，`{service="tf-gateway"}` 会查不到任何东西。
#
# 非 prod / 中间件容器打的是纯文本，app_json 解析失败时 Fluent Bit 保留原始
# record（log 字符串仍在），依然能被 {job="turbofeed"} 查到，只是没有 service label。
# =============================================================================
[SERVICE]
    Flush             1
    Log_Level         info
    Daemon            Off
    Parsers_File      /fluent-bit/etc/parsers.conf
    HTTP_Server       On
    HTTP_Listen       0.0.0.0
    HTTP_Port         2020
    Health_Check      On
    # 磁盘缓冲：采集器重启 / Loki 短暂不可用时，先把日志落本地，别直接丢。
    storage.path      /var/lib/fluent-bit/storage
    storage.sync      normal
    storage.checksum  off
    storage.max_chunks_up       128
    storage.backlog.mem_limit   32M

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*-json.log
    Tag               docker.*
    Parser            docker_json
    Docker_Mode       On
    Refresh_Interval  5
    Rotate_Wait       30
    Mem_Buf_Limit     32MB
    Skip_Long_Lines   On
    DB                /var/lib/fluent-bit/tail-container.db
    DB.Sync           Normal
    storage.type      filesystem

# 二次解析：把 log 字段里的应用 JSON 提升为顶层键
[FILTER]
    Name              parser
    Match             docker.*
    Key_Name          log
    Parser            app_json
    Reserve_Data      On
    Preserve_Key      Off

[OUTPUT]
    Name              loki
    Match             docker.*
    Host              loki
    Port              3100
    Uri               /loki/api/v1/push
    # 静态 label 保证所有日志至少可查；动态 label 只放低基数字段。
    Labels            job=turbofeed
    Label_Keys        $service,$level
    Auto_Kubernetes_Labels Off
    # 外层 Docker 噪声键不进 Loki
    Remove_Keys       stream,time,log
    Line_Format       json
    # Loki 未就绪 / 重启时无限重试，配合上面的磁盘缓冲避免丢日志
    Retry_Limit       False
