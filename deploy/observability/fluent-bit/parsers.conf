# 外层：Docker json-file 的一行。
# 不用 Name=docker：Fluent Bit 内置 parsers.conf 已有同名 docker parser，
# Parsers_File 是追加加载，重名会产生覆盖/告警，故显式改名 docker_json。
[PARSER]
    Name        docker_json
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On

# 里层：LogstashEncoder 8.1 输出的 prod 应用日志（时间字段为 @timestamp）
# 与 tf-gateway / tf-feed-engine / tf-counter 三份 logback-spring.xml 的 encoder 对应。
# includeContext=false 已关掉系统属性噪声；customFields 提供 service。
[PARSER]
    Name        app_json
    Format      json
    Time_Key    @timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On
