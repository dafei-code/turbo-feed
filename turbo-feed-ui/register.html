<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2330;
    --border: #2d3646;
    --text: #e6edf3;
    --text-dim: #8b98ab;
    --brand: #ff4d5e;
    --brand-2: #ff7a45;
    --accent: #3d7eff;
    --ok: #2ecc8f;
  }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .bg-stream {
    position: absolute;
    inset: 0;
    display: flex;
    gap: 90px;
    transform: rotate(-18deg) scale(1.4);
    opacity: .35;
    pointer-events: none;
  }
  .bg-stream .lane {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 24px;
    animation: flow 14s linear infinite;
  }
  .bg-stream .lane:nth-child(2) { animation-duration: 19s; }
  .bg-stream .lane:nth-child(3) { animation-duration: 11s; }
  .bg-stream .card {
    height: 64px;
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(61,126,255,.10), rgba(255,77,94,.08));
    border: 1px solid rgba(61,126,255,.14);
  }
  @keyframes flow {
    from { transform: translateY(-45%); }
    to   { transform: translateY(45%); }
  }

  .reg-wrap {
    position: relative;
    z-index: 2;
    width: 400px;
    background: rgba(22, 27, 34, .92);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 42px 38px 34px;
    box-shadow: 0 24px 64px rgba(0,0,0,.5);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .logo-mark {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 22px; color: #fff;
    letter-spacing: -1px;
  }
  .logo-name { font-size: 26px; font-weight: 700; letter-spacing: .5px; }
  .logo-name em { font-style: normal; color: var(--brand); }

  .slogan { color: var(--text-dim); font-size: 13px; margin-bottom: 30px; }

  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 7px;
  }
  .field .input {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 14px;
    transition: border-color .2s, box-shadow .2s;
  }
  .field .input:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(61,126,255,.18);
  }
  .field .input svg { flex: 0 0 18px; opacity: .55; }
  .field input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 15px;
    height: 46px;
  }
  .field input::placeholder { color: #55617a; }

  .btn-reg {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 4px;
    transition: transform .15s, filter .2s;
  }
  .btn-reg:hover { filter: brightness(1.1); }
  .btn-reg:active { transform: scale(.98); }

  .msg {
    display: none;
    margin-bottom: 16px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    background: rgba(255,77,94,.10);
    border: 1px solid rgba(255,77,94,.4);
    color: #ff8b96;
  }
  .msg.show { display: block; }

  .ok-box {
    display: none;
    margin-bottom: 16px;
    padding: 14px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.8;
    background: rgba(46,204,143,.10);
    border: 1px solid rgba(46,204,143,.4);
    color: #7ee2bd;
  }
  .ok-box.show { display: block; }
  .ok-box b { color: var(--ok); }

  .footer-row {
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .footer-row a { color: var(--accent); text-decoration: none; }
  .footer-row a:hover { text-decoration: underline; }

  .footer {
    position: absolute;
    bottom: 22px;
    width: 100%;
    text-align: center;
    color: #55617a;
    font-size: 12px;
    z-index: 2;
  }
  .footer span { color: #6b7a94; }
</style>
</head>

<script>
  // 后端网关地址：静态页与后端不同源（file:// 或其它端口），故写全址。
  var API_BASE = 'http://localhost:8080';

  function showMsg(text) {
    var el = document.getElementById('msg');
    el.textContent = text;
    el.classList.add('show');
    document.getElementById('okBox').classList.remove('show');
  }

  document.getElementById('regForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var phone = document.getElementById('phone').value.trim();
    var password = document.getElementById('password').value.trim();
    var nickname = document.getElementById('nickname').value.trim();
    if (!phone) return showMsg('请输入手机号');
    if (!password) return showMsg('请输入密码');

    var btn = document.querySelector('.btn-reg');
    btn.disabled = true;
    btn.textContent = '注册中...';
    try {
      var resp = await fetch(API_BASE + '/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ phone: phone, password: password, nickname: nickname })
      });
      var result = await resp.json();
      if (!result || result.code !== 0) {
        return showMsg((result && result.message) || '注册失败');
      }
      // 注册成功：展示账号信息，引导去登录换取 JWT（上传链路需令牌）。
      var ok = document.getElementById('okBox');
      ok.innerHTML = '<b>注册成功！</b><br>账号：' + result.data.phone
        + '<br>昵称：' + result.data.nickname
        + '<br><br><a href="login.html" style="color:var(--accent)">去登录 ›</a>';
      ok.classList.add('show');
      document.getElementById('msg').classList.remove('show');
      document.getElementById('regForm').style.display = 'none';
    } catch (err) {
      showMsg('无法连接后端服务，请确认网关已启动：' + API_BASE);
    } finally {
      btn.disabled = false;
      btn.textContent = '注 册';
    }
  });
</script>
