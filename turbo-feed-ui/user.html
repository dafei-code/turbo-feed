<title>TurboFeed · 创作者中心</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2330;
    --border: #2d3646;
    --text: #e6edf3;
    --text-dim: #8b98ab;
    --brand: #ff4d5e;
    --brand-2: #ff7a45;
    --accent: #3d7eff;
    --ok: #2ecc8f;
    --warn: #f0b429;
    --error: #ff6b6b;
    --sidebar-w: 240px;
  }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ========== 侧边栏 ========== */
  .sidebar {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    width: var(--sidebar-w);
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    z-index: 10;
  }
  .side-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 20px 20px 18px;
    border-bottom: 1px solid var(--border);
  }
  .side-logo .mark {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px; color: #fff;
  }
  .side-logo .name { font-size: 19px; font-weight: 700; }
  .side-logo .name em { font-style: normal; color: var(--brand); }

  .nav { flex: 1; padding: 14px 12px; overflow-y: auto; }
  .nav-group {
    font-size: 11px;
    color: #55617a;
    letter-spacing: 1px;
    padding: 14px 10px 6px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    color: var(--text-dim);
    cursor: pointer;
    margin-bottom: 2px;
    transition: background .15s, color .15s;
    text-decoration: none;
  }
  .nav-item:hover { background: rgba(61,126,255,.08); color: var(--text); }
  .nav-item.active {
    background: linear-gradient(90deg, rgba(255,77,94,.16), rgba(255,122,69,.06));
    color: #fff;
    border-left: 3px solid var(--brand);
  }
  .nav-item svg { flex: 0 0 17px; }

  .side-user {
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #6c5ce7);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: #fff;
  }
  .side-user .info { flex: 1; }
  .side-user .info .n { font-size: 13px; }
  .side-user .info .r { font-size: 11px; color: var(--text-dim); }
  .logout-btn {
    border: 1px solid var(--border);
    background: none;
    color: var(--text-dim);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
    transition: all .15s;
  }
  .logout-btn:hover { border-color: var(--brand); color: var(--brand); }

  /* ========== 主区域 ========== */
  .main {
    margin-left: var(--sidebar-w);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .topbar {
    height: 60px;
    padding: 0 26px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    background: rgba(22,27,34,.9);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .topbar .crumb { font-size: 15px; }
  .topbar .crumb b { font-weight: 600; }
  .topbar .crumb span { color: var(--text-dim); }
  .topbar .search {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    width: 260px;
  }
  .topbar .search input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-size: 13px;
  }
  .badge-dot {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    cursor: pointer;
  }

  .content {
    flex: 1;
    padding: 26px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  /* ========== 卡片 ========== */
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
  }
  .card-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title .sub {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 400;
    margin-left: auto;
  }

  /* ========== 个人信息卡片 ========== */
  .profile {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .profile .avatar {
    width: 72px; height: 72px;
    border-radius: 50%;
    font-size: 28px;
    background: linear-gradient(135deg, var(--accent), #6c5ce7);
  }
  .profile .meta { flex: 1; }
  .profile .meta .name {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .profile .meta .role {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px;
  }
  .profile .stats {
    display: flex;
    gap: 32px;
  }
  .profile .stats .item {
    text-align: center;
  }
  .profile .stats .item .num {
    font-size: 24px;
    font-weight: 700;
    line-height: 1.1;
  }
  .profile .stats .item .num.ok { color: var(--ok); }
  .profile .stats .item .num.warn { color: var(--warn); }
  .profile .stats .item .num.error { color: var(--error); }
  .profile .stats .item .label {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* ========== 上传区域 ========== */
  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 32px;
    text-align: center;
    background: rgba(61,126,255,.04);
    transition: border-color .2s, background .2s;
    cursor: pointer;
    position: relative;
  }
  .upload-zone:hover, .upload-zone.dragover {
    border-color: var(--accent);
    background: rgba(61,126,255,.08);
  }
  .upload-zone input[type=file] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }
  .upload-zone .icon {
    width: 48px; height: 48px;
    margin: 0 auto 12px;
    border-radius: 12px;
    background: rgba(61,126,255,.12);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
    font-size: 22px;
  }
  .upload-zone .tip {
    font-size: 14px;
    color: var(--text);
    margin-bottom: 6px;
  }
  .upload-zone .hint {
    font-size: 12px;
    color: var(--text-dim);
  }
  .upload-progress {
    margin-top: 14px;
    display: none;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .upload-progress.show { display: flex; }
  .upload-progress .bar {
    flex: 1;
    height: 6px;
    background: var(--panel-2);
    border-radius: 3px;
    overflow: hidden;
  }
  .upload-progress .bar i {
    display: block;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), #6c5ce7);
    transition: width .2s;
  }

  /* ========== 内容列表 ========== */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .filter-btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 7px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
  }
  .filter-btn:hover { color: var(--text); border-color: var(--accent); }
  .filter-btn.active {
    background: rgba(61,126,255,.12);
    border-color: var(--accent);
    color: var(--text);
  }
  .filter-btn .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    margin-right: 5px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
  }
  .media-card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: transform .15s, box-shadow .15s;
  }
  .media-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(0,0,0,.35);
  }
  .media-card .thumb {
    aspect-ratio: 16 / 10;
    background: #0a0d12;
    position: relative;
    overflow: hidden;
  }
  .media-card .thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .media-card .thumb .empty-img {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim);
    font-size: 13px;
  }
  .media-card .status {
    position: absolute;
    top: 10px; left: 10px;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;
    border: 1px solid;
    background: rgba(13,17,23,.75);
    backdrop-filter: blur(4px);
  }
  .media-card .status.pending { color: var(--warn); border-color: var(--warn); }
  .media-card .status.approved { color: var(--ok); border-color: var(--ok); }
  .media-card .status.rejected { color: var(--error); border-color: var(--error); }
  .media-card .info {
    padding: 12px;
  }
  .media-card .info .id {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
    word-break: break-all;
    line-height: 1.4;
  }
  .media-card .info .time {
    font-size: 12px;
    color: #55617a;
    margin-bottom: 10px;
  }
  .media-card .actions {
    display: flex;
    gap: 8px;
  }
  .media-card .actions button {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 6px;
    padding: 6px 0;
    font-size: 12px;
    cursor: pointer;
    transition: all .15s;
  }
  .media-card .actions button:hover {
    border-color: var(--accent);
    color: var(--text);
  }

  /* ========== 状态徽章（工具栏统计） ========== */
  .empty-state {
    padding: 50px 20px;
    text-align: center;
    color: var(--text-dim);
  }
  .empty-state .big {
    width: 64px; height: 64px;
    margin: 0 auto 16px;
    border-radius: 16px;
    background: var(--panel-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    color: #55617a;
  }

  /* ========== Toast ========== */
  .toast {
    position: fixed;
    top: 20px; right: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--text);
    box-shadow: 0 12px 40px rgba(0,0,0,.4);
    transform: translateX(140%);
    transition: transform .25s ease;
    z-index: 100;
    max-width: 320px;
  }
  .toast.show { transform: translateX(0); }
  .toast.ok { border-left-color: var(--ok); }
  .toast.error { border-left-color: var(--error); }

  /* ========== 未登录遮罩 ========== */
  .login-backdrop {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
  }
  .login-box {
    text-align: center;
  }
  .login-box p { color: var(--text-dim); margin-bottom: 16px; }
  .login-box a {
    display: inline-block;
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    color: #fff;
    text-decoration: none;
    padding: 10px 22px;
    border-radius: 8px;
    font-weight: 600;
  }
</style>
</head>

          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;vertical-align:-2px" data-page-node-id="SyFkJQnJaHtlM2a2WeholQ"><path d="M23 4v6h-6M1 20v-6h6" data-page-node-id="PRHCwy6A3ySVyWgRNqxano"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" data-page-node-id="hm5iRBIfCL1YrCO7oqADDM"/></svg>

<div class="toast" id="toast" data-page-node-id="F5UmgZPkKVAHrux0SAUHxz"></div>

<script>
  var API_BASE = 'http://localhost:8080';
  var TOKEN = localStorage.getItem('turbofeed:token');
  var USER = localStorage.getItem('turbofeed:user') || '用户';
  var allItems = [];
  var currentFilter = 'all';

  // 未登录拦截
  if (!TOKEN) {
    document.getElementById('loginBackdrop').style.display = 'flex';
  }

  // 初始化用户显示
  function initUser() {
    document.getElementById('sideUserName').textContent = USER;
    document.getElementById('sideUserAvatar').textContent = USER.charAt(0).toUpperCase();
    document.getElementById('topUserAvatar').textContent = USER.charAt(0).toUpperCase();
    document.getElementById('profileName').textContent = USER;
    document.getElementById('profileAvatar').textContent = USER.charAt(0).toUpperCase();
  }

  // Toast
  var toastTimer = null;
  function showToast(msg, type) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast ' + (type || '');
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 3000);
  }

  // 时间格式化
  function fmtTime(iso) {
    if (!iso) return '-';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' +
           pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function pad(n) { return n < 10 ? '0'+n : n; }

  // 状态标签
  function statusClass(s) {
    s = (s || '').toUpperCase();
    if (s === 'APPROVED') return 'approved';
    if (s === 'REJECTED') return 'rejected';
    return 'pending';
  }
  function statusText(s) {
    s = (s || '').toUpperCase();
    if (s === 'APPROVED') return '已通过';
    if (s === 'REJECTED') return '已驳回';
    return '审核中';
  }

  // 截断 mediaId 用于展示
  function shortId(mediaId) {
    if (!mediaId) return '-';
    if (mediaId.length <= 32) return mediaId;
    return mediaId.slice(0, 14) + '...' + mediaId.slice(-14);
  }

  // 加载内容列表
  function loadContent(manual) {
    var grid = document.getElementById('contentGrid');
    if (!manual) grid.innerHTML = '<div class="empty-state">加载中...</div>';

    fetch(API_BASE + '/api/media/mine', {
      headers: { 'Authorization': 'Bearer ' + TOKEN }
    })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (res.code !== 0) {
        grid.innerHTML = '<div class="empty-state">加载失败：' + (res.message || '未知错误') + '</div>';
        showToast('加载失败：' + (res.message || '未知错误'), 'error');
        return;
      }
      allItems = res.data || [];
      updateStats();
      renderGrid();
      if (manual) showToast('已刷新', 'ok');
    })
    .catch(function (err) {
      grid.innerHTML = '<div class="empty-state">无法连接后端服务，请确认网关已启动</div>';
      showToast('无法连接后端服务', 'error');
    });
  }

  // 更新统计
  function updateStats() {
    var total = allItems.length;
    var approved = allItems.filter(function (i) { return i.status === 'APPROVED'; }).length;
    var pending = allItems.filter(function (i) { return i.status === 'PENDING'; }).length;
    var rejected = allItems.filter(function (i) { return i.status === 'REJECTED'; }).length;
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statApproved').textContent = approved;
    document.getElementById('statPending').textContent = pending;
    document.getElementById('statRejected').textContent = rejected;
  }

  // 过滤
  function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn[data-filter]').forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-filter') === f);
    });
    renderGrid();
  }

  // 渲染网格
  function renderGrid() {
    var grid = document.getElementById('contentGrid');
    var items = currentFilter === 'all' ? allItems : allItems.filter(function (i) {
      return (i.status || '').toUpperCase() === currentFilter;
    });

    var keyword = (document.getElementById('searchInput').value || '').trim().toLowerCase();
    if (keyword) {
      items = items.filter(function (i) {
        return (i.mediaId || '').toLowerCase().indexOf(keyword) >= 0 ||
               (i.url || '').toLowerCase().indexOf(keyword) >= 0;
      });
    }

    if (!items.length) {
      grid.innerHTML = '<div class="empty-state"><div class="big">📭</div>暂无符合条件的内容<br>点击上方上传区域添加新内容</div>';
      return;
    }

    grid.innerHTML = '';
    items.forEach(function (item) {
      var stCls = statusClass(item.status);
      var stTxt = statusText(item.status);
      var card = document.createElement('div');
      card.className = 'media-card';
      card.innerHTML =
        '<div class="thumb">' +
          (item.url
            ? '<img src="' + item.url + '" alt="" onerror="this.style.display=\'none\';this.parentNode.innerHTML+=\'<div class=\\'empty-img\\'>加载失败</div>\'">'
            : '<div class="empty-img">无预览</div>') +
          '<span class="status ' + stCls + '">' + stTxt + '</span>' +
        '</div>' +
        '<div class="info">' +
          '<div class="id" title="' + (item.mediaId || '') + '">' + shortId(item.mediaId) + '</div>' +
          '<div class="time">' + fmtTime(item.createdAt) + '</div>' +
          '<div class="actions">' +
            '<button onclick="openImage(\'' + (item.url || '') + '\')">查看</button>' +
            '<button onclick="copyUrl(\'' + (item.url || '') + '\')">复制链接</button>' +
          '</div>' +
        '</div>';
      grid.appendChild(card);
    });
  }

  function openImage(url) {
    if (!url) return showToast('链接为空', 'error');
    window.open(url, '_blank');
  }

  function copyUrl(url) {
    if (!url) return showToast('链接为空', 'error');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () {
        showToast('链接已复制', 'ok');
      }, function () {
        fallbackCopy(url);
      });
    } else {
      fallbackCopy(url);
    }
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('链接已复制', 'ok'); }
    catch (e) { showToast('复制失败', 'error'); }
    document.body.removeChild(ta);
  }

  // 上传
  function doUpload(files) {
    if (!files || !files.length) return;
    var progress = document.getElementById('uploadProgress');
    var bar = document.getElementById('uploadBar');
    progress.classList.add('show');
    bar.style.width = '30%';

    var fd = new FormData();
    Array.prototype.forEach.call(files, function (f) { fd.append('files', f); });

    fetch(API_BASE + '/api/media/upload', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + TOKEN },
      body: fd
    })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      bar.style.width = '100%';
      setTimeout(function () { progress.classList.remove('show'); bar.style.width = '0%'; }, 400);
      if (res.code !== 0) {
        showToast('上传失败：' + (res.message || '未知错误'), 'error');
        return;
      }
      showToast('上传成功，已加入审核队列', 'ok');
      loadContent(false);
    })
    .catch(function (err) {
      progress.classList.remove('show');
      showToast('上传失败：' + (err.message || '网络错误'), 'error');
    });
  }

  // 上传事件
  var fileInput = document.getElementById('fileInput');
  var uploadZone = document.getElementById('uploadZone');
  fileInput.addEventListener('change', function () {
    doUpload(this.files);
    this.value = '';
  });

  uploadZone.addEventListener('dragover', function (e) {
    e.preventDefault();
    this.classList.add('dragover');
  });
  uploadZone.addEventListener('dragleave', function (e) {
    e.preventDefault();
    this.classList.remove('dragover');
  });
  uploadZone.addEventListener('drop', function (e) {
    e.preventDefault();
    this.classList.remove('dragover');
    doUpload(e.dataTransfer.files);
  });

  // 搜索
  document.getElementById('searchInput').addEventListener('input', function () {
    renderGrid();
  });

  // 退出
  function logout() {
    localStorage.removeItem('turbofeed:token');
    localStorage.removeItem('turbofeed:user');
    window.location.href = 'login.html';
  }

  // 初始化
  initUser();
  if (TOKEN) loadContent(false);
</script>
