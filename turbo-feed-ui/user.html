<!DOCTYPE html>

<title>TurboFeed · 创作者中心</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2330;
    --border: #2d3646;
    --text: #e6edf3;
    --text-dim: #8b98ab;
    --brand: #ff4d5e;
    --brand-2: #ff7a45;
    --accent: #3d7eff;
    --ok: #2ecc8f;
    --warn: #f0b429;
    --error: #ff6b6b;
    --sidebar-w: 240px;
  }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ========== 侧边栏 ========== */
  .sidebar {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    width: var(--sidebar-w);
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    z-index: 10;
  }
  .side-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 20px 20px 18px;
    border-bottom: 1px solid var(--border);
  }
  .side-logo .mark {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px; color: #fff;
  }
  .side-logo .name { font-size: 19px; font-weight: 700; }
  .side-logo .name em { font-style: normal; color: var(--brand); }

  .nav { flex: 1; padding: 14px 12px; overflow-y: auto; }
  .nav-group {
    font-size: 11px;
    color: #55617a;
    letter-spacing: 1px;
    padding: 14px 10px 6px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    color: var(--text-dim);
    cursor: pointer;
    margin-bottom: 2px;
    transition: background .15s, color .15s;
    text-decoration: none;
  }
  .nav-item:hover { background: rgba(61,126,255,.08); color: var(--text); }
  .nav-item.active {
    background: linear-gradient(90deg, rgba(255,77,94,.16), rgba(255,122,69,.06));
    color: #fff;
    border-left: 3px solid var(--brand);
  }
  .nav-item svg { flex: 0 0 17px; }

  .side-user {
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #6c5ce7);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: #fff;
  }
  .side-user .info { flex: 1; }
  .side-user .info .n { font-size: 13px; }
  .side-user .info .r { font-size: 11px; color: var(--text-dim); }
  .logout-btn {
    border: 1px solid var(--border);
    background: none;
    color: var(--text-dim);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
    transition: all .15s;
  }
  .logout-btn:hover { border-color: var(--brand); color: var(--brand); }

  /* ========== 主区域 ========== */
  .main {
    margin-left: var(--sidebar-w);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .topbar {
    height: 60px;
    padding: 0 26px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    background: rgba(22,27,34,.9);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .topbar .crumb { font-size: 15px; }
  .topbar .crumb b { font-weight: 600; }
  .topbar .crumb span { color: var(--text-dim); }
  .topbar .search {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    width: 260px;
  }
  .topbar .search input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-size: 13px;
  }
  .badge-dot {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    cursor: pointer;
  }

  .content {
    flex: 1;
    padding: 26px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  /* ========== 卡片 ========== */
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
  }
  .card-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title .sub {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 400;
    margin-left: auto;
  }

  /* ========== 个人信息卡片 ========== */
  .profile {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .profile .avatar {
    width: 72px; height: 72px;
    border-radius: 50%;
    font-size: 28px;
    background: linear-gradient(135deg, var(--accent), #6c5ce7);
  }
  .profile .meta { flex: 1; }
  .profile .meta .name {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .profile .meta .role {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px;
  }
  .profile .stats {
    display: flex;
    gap: 32px;
  }
  .profile .stats .item {
    text-align: center;
  }
  .profile .stats .item .num {
    font-size: 24px;
    font-weight: 700;
    line-height: 1.1;
  }
  .profile .stats .item .num.ok { color: var(--ok); }
  .profile .stats .item .num.warn { color: var(--warn); }
  .profile .stats .item .num.error { color: var(--error); }
  .profile .stats .item .label {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* ========== 上传区域 ========== */
  .upload-zone {
    display: block;
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 32px;
    text-align: center;
    background: rgba(61,126,255,.04);
    transition: border-color .2s, background .2s;
    cursor: pointer;
    position: relative;
  }
  .upload-zone:hover, .upload-zone.dragover {
    border-color: var(--accent);
    background: rgba(61,126,255,.08);
  }
.upload-zone input[type=file] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    z-index: 10;
}
  .upload-zone .icon {
    width: 48px; height: 48px;
    margin: 0 auto 12px;
    border-radius: 12px;
    background: rgba(61,126,255,.12);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
    font-size: 22px;
  }
  .upload-zone .tip {
    font-size: 14px;
    color: var(--text);
    margin-bottom: 6px;
  }
.upload-zone .hint {
    font-size: 12px;
    color: var(--text-dim);
}
/* 提示层不拦截鼠标/拖拽事件，让点击/拖拽穿透到下方 input 或 uploadZone */
.upload-zone .icon,
.upload-zone .tip,
.upload-zone .hint,
.upload-zone .upload-progress { pointer-events: none; }
  .upload-progress {
    margin-top: 14px;
    display: none;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .upload-progress.show { display: flex; }
  .upload-progress .bar {
    flex: 1;
    height: 6px;
    background: var(--panel-2);
    border-radius: 3px;
    overflow: hidden;
  }
  .upload-progress .bar i {
    display: block;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), #6c5ce7);
    transition: width .2s;
  }

  /* ========== 上传：已选预览（多图，上限 9） ========== */
  .upload-preview { margin-top: 14px; }
  .upload-preview-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .upload-preview-head b { color: var(--accent); font-weight: 600; }
  .upload-preview-head .clear-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    padding: 2px 4px;
  }
  .upload-preview-head .clear-btn:hover { color: var(--error); }
  .upload-thumbs {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 10px;
  }
  .upload-thumb {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: #0a0d12;
  }
  .upload-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .upload-thumb .del {
    position: absolute;
    top: 4px; right: 4px;
    width: 20px; height: 20px;
    border: none;
    border-radius: 50%;
    background: rgba(13,17,23,.8);
    color: #fff;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .upload-thumb .del:hover { background: var(--error); }
  .upload-thumb .seq {
    position: absolute;
    left: 4px; bottom: 4px;
    font-size: 10px;
    color: #fff;
    background: rgba(13,17,23,.7);
    border-radius: 4px;
    padding: 1px 5px;
  }
  .upload-actions { margin-top: 12px; display: flex; gap: 10px; }
  .upload-actions button {
    border-radius: 8px;
    padding: 9px 18px;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
  }
  .upload-actions .primary {
    background: var(--accent);
    border: 1px solid var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .upload-actions .primary:hover { filter: brightness(1.1); }
  .upload-actions .ghost {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .upload-actions .ghost:hover { color: var(--text); border-color: var(--accent); }

  /* 内容卡片：多图角标 + 卡内迷你轮播（一帖一卡） */
  .media-card .thumb .img-count {
    position: absolute;
    right: 10px; bottom: 10px;
    font-size: 11px;
    color: #fff;
    background: rgba(13,17,23,.75);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 20px;
    padding: 2px 8px;
    backdrop-filter: blur(4px);
  }
  .media-card .thumb .mini-slider {
    display: flex;
    height: 100%;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .media-card .thumb .mini-slider::-webkit-scrollbar { display: none; }
  .media-card .thumb .mini-slider img {
    flex: 0 0 100%;
    width: 100%;
    height: 100%;
    scroll-snap-align: center;
    object-fit: cover;
  }
  .media-card .thumb .mini-dots {
    position: absolute;
    left: 0; right: 0;
    bottom: 8px;
    display: flex;
    justify-content: center;
    gap: 4px;
    pointer-events: none;
  }
  .media-card .thumb .mini-dots i {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: rgba(255,255,255,.35);
  }
  .media-card .thumb .mini-dots i.on { background: #fff; }

  /* ========== 内容列表 ========== */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .filter-btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 7px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
  }
  .filter-btn:hover { color: var(--text); border-color: var(--accent); }
  .filter-btn.active {
    background: rgba(61,126,255,.12);
    border-color: var(--accent);
    color: var(--text);
  }
  .filter-btn .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    margin-right: 5px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
  }
  .media-card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: transform .15s, box-shadow .15s;
  }
  .media-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(0,0,0,.35);
  }
  .media-card .thumb {
    aspect-ratio: 16 / 10;
    background: #0a0d12;
    position: relative;
    overflow: hidden;
  }
  .media-card .thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .media-card .thumb .empty-img {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim);
    font-size: 13px;
  }
  .media-card .status {
    position: absolute;
    top: 10px; left: 10px;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;
    border: 1px solid;
    background: rgba(13,17,23,.75);
    backdrop-filter: blur(4px);
  }
  .media-card .status.pending { color: var(--warn); border-color: var(--warn); }
  .media-card .status.approved { color: var(--ok); border-color: var(--ok); }
  .media-card .status.rejected { color: var(--error); border-color: var(--error); }
  .media-card .info {
    padding: 12px;
  }
  .media-card .info .id {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
    word-break: break-all;
    line-height: 1.4;
  }
  .media-card .info .time {
    font-size: 12px;
    color: #55617a;
    margin-bottom: 10px;
  }
  .media-card .actions {
    display: flex;
    gap: 8px;
  }
  .media-card .actions button {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 6px;
    padding: 6px 0;
    font-size: 12px;
    cursor: pointer;
    transition: all .15s;
  }
  .media-card .actions button:hover {
    border-color: var(--accent);
    color: var(--text);
  }
  .media-card .actions button.danger:hover {
    border-color: var(--error);
    color: var(--error);
  }

  /* ========== 状态徽章（工具栏统计） ========== */
  .empty-state {
    padding: 50px 20px;
    text-align: center;
    color: var(--text-dim);
  }
  .empty-state .big {
    width: 64px; height: 64px;
    margin: 0 auto 16px;
    border-radius: 16px;
    background: var(--panel-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    color: #55617a;
  }

  /* ========== Toast ========== */
  .toast {
    position: fixed;
    top: 20px; right: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--text);
    box-shadow: 0 12px 40px rgba(0,0,0,.4);
    transform: translateX(140%);
    transition: transform .25s ease;
    z-index: 100;
    max-width: 320px;
  }
  .toast.show { transform: translateX(0); }
  .toast.ok { border-left-color: var(--ok); }
  .toast.error { border-left-color: var(--error); }

  /* ========== 未登录遮罩 ========== */
  .login-backdrop {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
  }
  .login-box {
    text-align: center;
  }
  .login-box p { color: var(--text-dim); margin-bottom: 16px; }
  .login-box a {
    display: inline-block;
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    color: #fff;
    text-decoration: none;
    padding: 10px 22px;
    border-radius: 8px;
    font-weight: 600;
  }
</style>
</head>

<script>
  var API_BASE = 'http://localhost:8080';
  var TOKEN = localStorage.getItem('turbofeed:token');
  var USER = localStorage.getItem('turbofeed:user') || '用户';
  var allItems = [];
  var currentFilter = 'all';

  // 一帖多图（抖音式图文）：一次上传 1..9 张，同一批 = 一个帖子。
  // 数量/大小/类型与后端校验口径对齐（后端是权威，前端先拦是为了少一次无效往返）。
  var MAX_FILES = 9;
  var MAX_SIZE = 5 * 1024 * 1024;
  var ALLOWED_TYPES = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
  var selectedFiles = [];   // 已选待传队列：先预览/可逐张删除，确认后再整批提交

  // 未登录拦截
  if (!TOKEN) {
    document.getElementById('loginBackdrop').style.display = 'flex';
  }

  // 初始化用户显示
  function initUser() {
    document.getElementById('sideUserName').textContent = USER;
    document.getElementById('sideUserAvatar').textContent = USER.charAt(0).toUpperCase();
    document.getElementById('topUserAvatar').textContent = USER.charAt(0).toUpperCase();
    document.getElementById('profileName').textContent = USER;
    document.getElementById('profileAvatar').textContent = USER.charAt(0).toUpperCase();
  }

  // Toast
  var toastTimer = null;
  function showToast(msg, type) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast ' + (type || '');
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 3000);
  }

  // 时间格式化
  function fmtTime(iso) {
    if (!iso) return '-';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' +
           pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function pad(n) { return n < 10 ? '0'+n : n; }

  // 状态标签
  function statusClass(s) {
    s = (s || '').toUpperCase();
    if (s === 'APPROVED') return 'approved';
    if (s === 'REJECTED') return 'rejected';
    return 'pending';
  }
  function statusText(s) {
    s = (s || '').toUpperCase();
    if (s === 'APPROVED') return '已通过';
    if (s === 'REJECTED') return '已驳回';
    return '审核中';
  }

  // 截断 mediaId 用于展示
  function shortId(mediaId) {
    if (!mediaId) return '-';
    if (mediaId.length <= 32) return mediaId;
    return mediaId.slice(0, 14) + '...' + mediaId.slice(-14);
  }

  // 加载内容列表
  function loadContent(manual) {
    var grid = document.getElementById('contentGrid');
    if (!manual) grid.innerHTML = '<div class="empty-state">加载中...</div>';

    fetch(API_BASE + '/api/media/mine', {
      headers: { 'Authorization': 'Bearer ' + TOKEN }
    })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (res.code !== 0) {
        grid.innerHTML = '<div class="empty-state">加载失败：' + (res.message || '未知错误') + '</div>';
        showToast('加载失败：' + (res.message || '未知错误'), 'error');
        return;
      }
      allItems = res.data || [];
      updateStats();
      renderGrid();
      if (manual) showToast('已刷新', 'ok');
    })
    .catch(function (err) {
      grid.innerHTML = '<div class="empty-state">无法连接后端服务，请确认网关已启动</div>';
      showToast('无法连接后端服务', 'error');
    });
  }

  // 取一条记录的全部图片：优先 images（帖子内按 seq 排序），历史单图行回退 [url]
  function imgUrlsOf(item) {
    if (item && item.images && item.images.length) return item.images;
    return (item && item.url) ? [item.url] : [];
  }
  // 帖子身份：有 postId 用 postId，历史单图数据回退 mediaId（与后端 timelineKey 口径一致）
  function postKeyOf(item) {
    return (item && (item.postId || item.mediaId)) || '';
  }

  // 按帖聚合：后端已按「seq=0 代表行 + 帖内图片」返回，这里再做一次幂等归并，
  // 保证历史单图行（无 postId）与新帖子（有 postId）都能得到「一帖一卡」。
  function groupPosts(items) {
    var map = {};
    var order = [];
    (items || []).forEach(function (it) {
      var key = postKeyOf(it);
      if (!key) return;
      if (!map[key]) {
        map[key] = {
          key: key,
          postId: it.postId || '',
          mediaId: it.mediaId || '',
          status: it.status,
          createdAt: it.createdAt,
          caption: it.caption || '',
          images: []
        };
        order.push(key);
      }
      var p = map[key];
      imgUrlsOf(it).forEach(function (u) {
        if (u && p.images.indexOf(u) < 0) p.images.push(u);
      });
      if (!p.status && it.status) p.status = it.status;
      if (!p.createdAt && it.createdAt) p.createdAt = it.createdAt;
      if (!p.mediaId && it.mediaId) p.mediaId = it.mediaId;
    });
    return order.map(function (k) { return map[k]; });
  }

  // 更新统计（以「帖子」为口径，与卡片数量一致）
  function updateStats() {
    var posts = groupPosts(allItems);
    var approved = posts.filter(function (p) { return p.status === 'APPROVED'; }).length;
    var pending = posts.filter(function (p) { return p.status === 'PENDING'; }).length;
    var rejected = posts.filter(function (p) { return p.status === 'REJECTED'; }).length;
    document.getElementById('statTotal').textContent = posts.length;
    document.getElementById('statApproved').textContent = approved;
    document.getElementById('statPending').textContent = pending;
    document.getElementById('statRejected').textContent = rejected;
  }

  // 过滤
  function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn[data-filter]').forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-filter') === f);
    });
    renderGrid();
  }

  // 渲染网格：一个帖子一张卡，帖内多图可在卡内横向滑动（带圆点指示）
  function renderGrid() {
    var grid = document.getElementById('contentGrid');
    var posts = groupPosts(allItems);
    if (currentFilter !== 'all') {
      posts = posts.filter(function (p) {
        return (p.status || '').toUpperCase() === currentFilter;
      });
    }

    var keyword = (document.getElementById('searchInput').value || '').trim().toLowerCase();
    if (keyword) {
      posts = posts.filter(function (p) {
        if ((p.postId || '').toLowerCase().indexOf(keyword) >= 0) return true;
        if ((p.mediaId || '').toLowerCase().indexOf(keyword) >= 0) return true;
        return p.images.some(function (u) { return (u || '').toLowerCase().indexOf(keyword) >= 0; });
      });
    }

    if (!posts.length) {
      grid.innerHTML = '<div class="empty-state"><div class="big">📭</div>暂无符合条件的内容<br>点击上方上传区域添加新内容</div>';
      return;
    }

    grid.innerHTML = '';
    posts.forEach(function (p) {
      var stCls = statusClass(p.status);
      var stTxt = statusText(p.status);
      var n = p.images.length;
      var thumb;
      if (!n) {
        thumb = '<div class="empty-img">无预览</div>';
      } else if (n === 1) {
        thumb = '<img src="' + p.images[0] + '" alt="">';
      } else {
        thumb =
          '<div class="mini-slider" data-slider>' +
            p.images.map(function (u) { return '<img src="' + u + '" alt="">'; }).join('') +
          '</div>' +
          '<div class="mini-dots">' +
            p.images.map(function (_, i) { return '<i class="' + (i === 0 ? 'on' : '') + '"></i>'; }).join('') +
          '</div>';
      }

      var card = document.createElement('div');
      card.className = 'media-card';
      card.innerHTML =
        '<div class="thumb">' + thumb +
          (n > 1 ? '<span class="img-count">' + n + ' 图</span>' : '') +
          '<span class="status ' + stCls + '">' + stTxt + '</span>' +
        '</div>' +
        '<div class="info">' +
          '<div class="id" title="' + (p.postId || p.mediaId || '') + '">' + shortId(p.postId || p.mediaId) + '</div>' +
          '<div class="time">' + fmtTime(p.createdAt) + (n > 1 ? ' · ' + n + ' 张图' : '') + '</div>' +
          '<div class="actions">' +
            '<button onclick="openImage(\'' + (p.images[0] || '') + '\')">查看</button>' +
            '<button onclick="copyUrl(\'' + (p.images[0] || '') + '\')">复制链接</button>' +
            '<button class="danger" onclick="deleteMedia(\'' + (p.mediaId || '') + '\')">删除</button>' +
          '</div>' +
        '</div>';
      grid.appendChild(card);
    });

    bindMiniSliders(grid);
  }

  // 卡内多图轮播：横向滚动时同步圆点高亮
  function bindMiniSliders(root) {
    Array.prototype.forEach.call(root.querySelectorAll('[data-slider]'), function (sl) {
      var dots = sl.parentNode.querySelectorAll('.mini-dots i');
      if (!dots.length) return;
      sl.addEventListener('scroll', function () {
        var idx = Math.round(sl.scrollLeft / Math.max(1, sl.clientWidth));
        Array.prototype.forEach.call(dots, function (d, i) {
          d.classList.toggle('on', i === idx);
        });
      });
    });
  }

  function openImage(url) {
    if (!url) return showToast('链接为空', 'error');
    window.open(url, '_blank');
  }

  function copyUrl(url) {
    if (!url) return showToast('链接为空', 'error');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () {
        showToast('链接已复制', 'ok');
      }, function () {
        fallbackCopy(url);
      });
    } else {
      fallbackCopy(url);
    }
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('链接已复制', 'ok'); }
    catch (e) { showToast('复制失败', 'error'); }
    document.body.removeChild(ta);
  }

  // 删除自己的内容：整帖删除（MinIO 物理删除 + MySQL 逻辑删除 status=DELETED）。
  // 后端以 mediaId 为入口解析出 postId，再整帖处理；这里传的即卡片对应的代表行 mediaId。
  function deleteMedia(mediaId) {
    if (!mediaId) return;
    var target = null;
    for (var i = 0; i < allItems.length; i++) {
      if (allItems[i].mediaId === mediaId) { target = allItems[i]; break; }
    }
    var postKey = target ? postKeyOf(target) : mediaId;
    var n = target ? imgUrlsOf(target).length : 1;
    var tip = n > 1
      ? '确定删除这个帖子吗？该帖共 ' + n + ' 张图，将整帖删除并从「我的内容」与公域发现流移除。'
      : '确定删除这条内容吗？删除后将从「我的内容」与公域发现流移除。';
    if (!confirm(tip)) return;

    fetch(API_BASE + '/api/media?mediaId=' + encodeURIComponent(mediaId), {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + TOKEN }
    })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (res.code !== 0) {
        showToast('删除失败：' + (res.message || '未知错误'), 'error');
        return;
      }
      allItems = allItems.filter(function (it) { return postKeyOf(it) !== postKey; });
      updateStats();
      renderGrid();
      showToast(n > 1 ? '整帖已删除' : '已删除', 'ok');
    })
    .catch(function (err) {
      showToast('删除失败：' + (err.message || '网络错误'), 'error');
    });
  }

  // ========== 上传：先加入待传队列（可预览 / 逐张删除），再整批提交 ==========
  var previewUrls = [];
  function revokePreviewUrls() {
    previewUrls.forEach(function (u) { try { URL.revokeObjectURL(u); } catch (e) {} });
    previewUrls = [];
  }

  // 选择/拖入文件 → 入队（类型、大小、单帖上限均在前端先拦，减少无效往返）
  function addFiles(fileList) {
    if (!fileList || !fileList.length) return;
    var ignored = [];
    Array.prototype.forEach.call(fileList, function (f) {
      if (selectedFiles.length >= MAX_FILES) { ignored.push(f.name + '（超出 ' + MAX_FILES + ' 张上限）'); return; }
      if (f.type && ALLOWED_TYPES.indexOf(f.type) < 0) { ignored.push(f.name + '（格式不支持）'); return; }
      if (f.size === 0) { ignored.push(f.name + '（空文件）'); return; }
      if (f.size > MAX_SIZE) { ignored.push(f.name + '（超过 5MB）'); return; }
      var dup = selectedFiles.some(function (s) {
        return s.name === f.name && s.size === f.size && s.lastModified === f.lastModified;
      });
      if (dup) return;
      selectedFiles.push(f);
    });
    if (ignored.length) {
      showToast('已忽略 ' + ignored.length + ' 个文件：' + ignored[0] + (ignored.length > 1 ? ' 等' : ''), 'error');
    }
    renderPreview();
  }

  function renderPreview() {
    var box = document.getElementById('uploadPreview');
    var thumbs = document.getElementById('uploadThumbs');
    var n = selectedFiles.length;

    revokePreviewUrls();
    if (!n) {
      box.style.display = 'none';
      thumbs.innerHTML = '';
      return;
    }

    box.style.display = 'block';
    document.getElementById('previewCount').textContent = n;
    document.getElementById('submitCount').textContent = n;
    document.getElementById('submitBtn').disabled = false;

    var html = '';
    selectedFiles.forEach(function (f, i) {
      var url = URL.createObjectURL(f);
      previewUrls.push(url);
      html +=
        '<div class="upload-thumb">' +
          '<img src="' + url + '" alt="" title="' + f.name + '">' +
          '<button type="button" class="del" title="移除这张" onclick="removeSelected(' + i + ')">×</button>' +
          '<span class="seq">' + (i + 1) + '</span>' +
        '</div>';
    });
    thumbs.innerHTML = html;
  }

  function removeSelected(idx) {
    selectedFiles.splice(idx, 1);
    renderPreview();
  }

  function clearSelection() {
    selectedFiles = [];
    renderPreview();
  }

  // 整批提交：一次请求 = 一个帖子（1..9 张）
  //
  // 采用「预签名直传」（抖音式）：① 向网关申请上传凭证 → ② 每张图直接 PUT 到对象存储
  // → ③ 通知网关完成。字节流不经过网关，弱网/大图下更稳，也不会占满网关带宽。
  // 注意：第 ② 步的 Content-Type 必须与第 ① 步声明的一致（该头已被服务端纳入签名）。
  function submitSelection() {
    if (!selectedFiles.length) { showToast('请先选择图片', 'error'); return; }
    if (selectedFiles.length > MAX_FILES) { showToast('单次最多 ' + MAX_FILES + ' 张', 'error'); return; }

    var progress = document.getElementById('uploadProgress');
    var bar = document.getElementById('uploadBar');
    var btn = document.getElementById('submitBtn');
    progress.classList.add('show');
    bar.style.width = '5%';
    btn.disabled = true;

    // 幂等键：同一次提交（含重试）复用同一个 requestId，服务端窗口内去重，避免重复建帖
    var requestId = 'ui-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
    var authHeaders = { 'Authorization': 'Bearer ' + TOKEN, 'X-Request-Id': requestId };
    var uploadCount = selectedFiles.length;

    // ① 申请预签名凭证（只传元数据，不含字节）
    var metas = selectedFiles.map(function (f) {
      return { fileName: f.name, size: f.size, contentType: f.type || '' };
    });

    fetch(API_BASE + '/api/media/presign', {
      method: 'POST',
      headers: { 'Authorization': authHeaders.Authorization, 'X-Request-Id': requestId,
                 'Content-Type': 'application/json' },
      body: JSON.stringify({ files: metas, caption: '' })
    })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (res.code !== 0) { throw new Error(res.message || '获取上传凭证失败'); }
      return res.data;
    })
    .then(function (data) {
      // ② 逐张直传对象存储（可并发）
      var done = 0, total = data.items.length;
      return Promise.all(data.items.map(function (item) {
        var file = selectedFiles[item.seq];
        return fetch(item.uploadUrl, {
          method: 'PUT',
          // 必须与申请时声明的 contentType 一致，否则对象存储按签名校验失败拒绝
          headers: { 'Content-Type': file.type || 'application/octet-stream' },
          body: file
        }).then(function (r) {
          if (!r.ok) { throw new Error('第 ' + (item.seq + 1) + ' 张直传失败（HTTP ' + r.status + '）'); }
          done++;
          bar.style.width = (10 + Math.round(done * 80 / total)) + '%';
        });
      })).then(function () { return data; });
    })
    .then(function (data) {
      // ③ 通知完成：服务端复核后异步落库送审（返回 202 受理）
      bar.style.width = '95%';
      return fetch(API_BASE + '/api/media/complete', {
        method: 'POST',
        headers: { 'Authorization': authHeaders.Authorization, 'X-Request-Id': requestId,
                   'Content-Type': 'application/json' },
        body: JSON.stringify({ postId: data.postId })
      })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res.code !== 0) { throw new Error(res.message || '完成通知失败'); }
        return res.data;
      });
    })
    .then(function () {
      bar.style.width = '100%';
      btn.disabled = false;
      setTimeout(function () { progress.classList.remove('show'); bar.style.width = '0%'; }, 400);
      selectedFiles = [];
      renderPreview();
      showToast('已上传 ' + uploadCount + ' 张，作为一个帖子进入审核队列', 'ok');
      loadContent(false);
    })
    .catch(function (err) {
      // 失败保留已选，用户可直接重试（配合同一个 requestId 也不会产生重复帖子）。
      // 已直传但未完成的对象由服务端的孤儿清理任务回收，不会永久占用存储。
      progress.classList.remove('show');
      bar.style.width = '0%';
      btn.disabled = false;
      showToast('上传失败：' + (err.message || '网络错误'), 'error');
    });
  }

  // 上传事件（change 通过 input 行内 onchange 触发，避免部分浏览器下 JS 监听不生效）
  var uploadZone = document.getElementById('uploadZone');

  uploadZone.addEventListener('dragover', function (e) {
    e.preventDefault();
    this.classList.add('dragover');
  });
  uploadZone.addEventListener('dragleave', function (e) {
    e.preventDefault();
    this.classList.remove('dragover');
  });
  uploadZone.addEventListener('drop', function (e) {
    e.preventDefault();
    this.classList.remove('dragover');
    addFiles(e.dataTransfer.files);
  });

  // 搜索
  document.getElementById('searchInput').addEventListener('input', function () {
    renderGrid();
  });

  // 退出
  function logout() {
    localStorage.removeItem('turbofeed:token');
    localStorage.removeItem('turbofeed:user');
    window.location.href = 'login.html';
  }

  // 初始化
  initUser();
  if (TOKEN) loadContent(false);
</script>

</body>
</html>
