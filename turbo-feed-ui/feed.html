<title>TurboFeed · 推荐 Feed 流</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #2d3646;
    --text: #e6edf3;
    --text-dim: #8b98ab;
    --brand: #ff4d5e;
    --brand-2: #ff7a45;
    --accent: #3d7eff;
    --ok: #2ecc8f;
    --warn: #f0b429;
    --sidebar-w: 200px;
    --header-h: 64px;
  }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: #000;
    color: var(--text);
    overflow: hidden;
  }
  .app { display: flex; height: 100vh; }

  /* ===== 侧边栏 ===== */
  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: #0f0f0f;
    border-right: 1px solid rgba(255,255,255,.06);
    display: flex; flex-direction: column;
    padding: 16px 10px;
    overflow-y: auto;
  }
  .logo {
    display: flex; align-items: center; gap: 8px;
    padding: 0 10px 18px;
    font-size: 20px; font-weight: 800;
  }
  .logo .t { color: var(--brand); }
  .nav-group {
    color: #666;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 12px 10px 6px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 12px;
    border-radius: 8px;
    color: #b0b0b0;
    font-size: 14px;
    cursor: pointer;
    transition: .15s;
    position: relative;
  }
  .nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
  .nav-item.active {
    background: linear-gradient(90deg, rgba(255,77,94,.18), rgba(255,122,69,.05));
    color: #fff;
    font-weight: 600;
  }
  .nav-item svg { flex: 0 0 20px; }
  .nav-item .badge {
    position: absolute; right: 10px;
    min-width: 16px; height: 16px; padding: 0 5px;
    background: var(--brand); color: #fff;
    border-radius: 8px; font-size: 10px;
    display: flex; align-items: center; justify-content: center;
  }

  /* ===== 主内容 ===== */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .header {
    height: var(--header-h);
    display: flex; align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    background: #0f0f0f;
    border-bottom: 1px solid rgba(255,255,255,.06);
    flex-shrink: 0;
  }
  .search {
    display: flex; align-items: center;
    background: rgba(255,255,255,.08);
    border-radius: 24px;
    width: 360px; height: 40px;
    padding: 0 16px;
    gap: 10px;
    transition: background .2s;
  }
  .search:focus-within { background: rgba(255,255,255,.12); }
  .search input {
    flex: 1; background: none; border: none; outline: none;
    color: #fff; font-size: 14px;
  }
  .search input::placeholder { color: #777; }
  .search button {
    border: none; background: none; color: #aaa; cursor: pointer;
    font-size: 13px; display: flex; align-items: center;
  }
  .header-right {
    display: flex; align-items: center; gap: 18px;
  }
  .h-icon {
    color: #b0b0b0; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 11px;
    transition: color .15s;
  }
  .h-icon:hover { color: #fff; }
  .h-icon svg { display: block; }
  .avatar-s {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #6c5ce7);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; font-size: 13px;
  }

  /* ===== Feed 区 ===== */
  .feed {
    flex: 1; position: relative;
    overflow: hidden;
    background: #000;
  }
  .feed-list {
    height: 100%;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
  }
  .feed-list::-webkit-scrollbar { display: none; }
  .feed-item {
    height: 100%;
    scroll-snap-align: start;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* 视频容器 */
  .video-wrap {
    position: relative;
    width: 56vh; max-width: 100%;
    height: 90vh;
    border-radius: 14px;
    overflow: hidden;
    background: #111;
    box-shadow: 0 18px 60px rgba(0,0,0,.7);
  }
  .video-poster {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    z-index: 1;
  }
  .video-el {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    position: relative; z-index: 2;
  }
  .play-mask {
    position: absolute; inset: 0;
    z-index: 3;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    opacity: 0;
    transition: opacity .2s;
  }
  .play-mask.show { opacity: 1; }
  .play-mask .big-play {
    width: 84px; height: 84px;
    border-radius: 50%;
    background: rgba(255,255,255,.16);
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .play-mask .big-play svg { margin-left: 5px; }

  /* 底部信息 */
  .info-layer {
    position: absolute; left: 0; bottom: 0; right: 0;
    padding: 24px 18px 28px;
    background: linear-gradient(transparent, rgba(0,0,0,.8));
    z-index: 4;
    pointer-events: none;
  }
  .info-layer > * { pointer-events: auto; }
  .author {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 600;
    margin-bottom: 10px;
  }
  .author .tag {
    font-size: 11px; color: var(--brand);
    border: 1px solid var(--brand);
    padding: 1px 6px;
    border-radius: 4px;
    font-weight: 500;
  }
  .desc {
    font-size: 14px; color: #eee;
    line-height: 1.5;
    margin-bottom: 10px;
    max-width: 82%;
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .music {
    display: inline-flex; align-items: center; gap: 8px;
    color: #fff; font-size: 13px;
    background: rgba(255,255,255,.12);
    padding: 5px 12px 5px 8px;
    border-radius: 20px;
  }
  .music .disc {
    width: 18px; height: 18px; border-radius: 50%;
    border: 1px solid #fff;
    display: flex; align-items: center; justify-content: center;
    animation: spin 4s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== 右侧交互按钮 ===== */
  .actions {
    position: absolute; right: 18px; bottom: 90px;
    z-index: 5;
    display: flex; flex-direction: column; align-items: center;
    gap: 16px;
  }
  .action {
    display: flex; flex-direction: column; align-items: center;
    gap: 3px; color: #fff; cursor: pointer;
    user-select: none;
  }
  .action .icon {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: rgba(255,255,255,.10);
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s, background .15s;
  }
  .action .icon:hover { transform: scale(1.08); background: rgba(255,255,255,.18); }
  .action .icon:active { transform: scale(.95); }
  .action.liked .icon { background: rgba(255,77,94,.2); }
  .action.faved .icon { background: rgba(240,180,41,.2); }
  .action .count { font-size: 12px; color: #ddd; margin-top: 2px; }
  .action .label { font-size: 11px; color: #aaa; }
  .action .heart { color: #fff; transition: .2s; }
  .action.liked .heart { color: var(--brand); }
  .action .star { color: #fff; transition: .2s; }
  .action.faved .star { color: var(--warn); }

  /* 头像 + 关注 */
  .action-avatar {
    width: 52px; height: 52px; border-radius: 50%;
    position: relative;
    border: 2px solid #fff;
    background: linear-gradient(135deg, var(--accent), #6c5ce7);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
  }
  .follow-plus {
    position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%);
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--brand); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1;
  }

  /* ===== 评论区抽屉 ===== */
  .drawer-overlay {
    position: absolute; inset: 0; z-index: 20;
    background: rgba(0,0,0,.6);
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
  }
  .drawer-overlay.show { opacity: 1; pointer-events: auto; }
  .comment-drawer {
    position: absolute; right: 0; top: 0; bottom: 0;
    width: 420px; max-width: 90%;
    background: #141414;
    border-left: 1px solid rgba(255,255,255,.08);
    transform: translateX(100%);
    transition: transform .25s;
    display: flex; flex-direction: column;
    z-index: 21;
  }
  .drawer-overlay.show + .comment-drawer,
  .comment-drawer.open { transform: translateX(0); }
  .cm-head {
    padding: 18px 20px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    display: flex; justify-content: space-between; align-items: center;
  }
  .cm-head h3 { font-size: 16px; }
  .cm-head .close { color: #999; cursor: pointer; }
  .cm-head .close:hover { color: #fff; }
  .cm-list {
    flex: 1; overflow-y: auto; padding: 14px 20px;
  }
  .cm-item { display: flex; gap: 12px; margin-bottom: 16px; }
  .cm-avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #3d7eff, #6c5ce7);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
  }
  .cm-body { flex: 1; }
  .cm-user { font-size: 13px; color: #aaa; margin-bottom: 4px; }
  .cm-text { font-size: 14px; line-height: 1.5; color: #eee; }
  .cm-actions { display: flex; gap: 14px; margin-top: 6px; font-size: 12px; color: #777; }
  .cm-actions span { cursor: pointer; }
  .cm-actions span:hover { color: #fff; }
  .cm-input {
    padding: 14px 18px;
    border-top: 1px solid rgba(255,255,255,.08);
    display: flex; gap: 10px; align-items: center;
  }
  .cm-input input {
    flex: 1; height: 40px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.06);
    outline: none; color: #fff; padding: 0 12px;
  }
  .cm-input button {
    border: none; height: 40px; padding: 0 18px; border-radius: 8px;
    background: var(--brand); color: #fff; font-weight: 600;
    cursor: pointer;
  }
  .cm-empty { color: #666; text-align: center; padding: 50px 0; }

  /* ===== 分享弹窗 ===== */
  .share-pop {
    position: absolute; right: 86px; bottom: 170px;
    background: #1a1a1a;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px;
    padding: 10px 0;
    width: 130px;
    z-index: 15;
    opacity: 0; pointer-events: none; transform: translateY(8px);
    transition: .2s;
  }
  .share-pop.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .share-pop li {
    list-style: none; padding: 9px 16px;
    font-size: 13px; color: #ccc; cursor: pointer;
  }
  .share-pop li:hover { background: rgba(255,255,255,.08); color: #fff; }

  /* Toast */
  .toast {
    position: absolute; left: 50%; top: 80px; transform: translateX(-50%);
    background: rgba(30,30,30,.92); border: 1px solid rgba(255,255,255,.1);
    padding: 10px 18px; border-radius: 8px;
    color: #fff; font-size: 13px;
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
    z-index: 30;
  }
  .toast.show { opacity: 1; }

  /* 进度条 */
  .progress {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 3px; background: rgba(255,255,255,.15);
    z-index: 6;
  }
  .progress-bar {
    height: 100%; width: 0%;
    background: var(--brand);
  }

  /* 滚动提示 */
  .swipe-hint {
    position: absolute; right: 24px; top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,.5);
    font-size: 11px;
    writing-mode: vertical-lr;
    letter-spacing: 2px;
    z-index: 2;
  }

  @media (max-width: 900px) {
    .sidebar { display: none; }
    .actions { right: 8px; bottom: 60px; gap: 10px; }
    .action .icon { width: 42px; height: 42px; }
    .video-wrap { width: 100vw; height: 100vh; border-radius: 0; }
    .search { display: none; }
  }
</style>

          <div class="icon" data-page-node-id="QFgKTCfyK9aKT3XskN9Xnz"><svg class="star" viewBox="0 0 24 24" width="25" height="25" fill="currentColor" data-page-node-id="yDoe3NC3HrQuP16ok34zf2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" data-page-node-id="l4pwCY4D6BgCBx0oBc9s20"/></svg></div>
          <div class="count" id="favCount" data-page-node-id="AM886SyBFRjwEh52WGviyr">4305</div>
        </div>
        <div class="action" id="btnShare" data-page-node-id="Tyw4XsQQruDKTGBlH0Pde3">
          <div class="icon" data-page-node-id="g4CXqnepL4HNGobGDtl6Yt"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" data-page-node-id="KtBB57xG05BOb0tTPFdN1D"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" data-page-node-id="HvGbrgmQ0A3BRTewaHb4Ri"/><polyline points="16 6 12 2 8 6" data-page-node-id="wIO1wztRbJAoHjdiLVndxN"/><line x1="12" y1="2" x2="12" y2="15" data-page-node-id="o1zCg6lCYc42X6oCc53FD5"/></svg></div>
          <div class="count" id="shareCount" data-page-node-id="uPqLNIZOxJlpD4PL1kcnB9">105</div>

          <div class="icon" data-page-node-id="eDZ3ywikj9q8CGX4d6AyhH"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" data-page-node-id="qjHXOKJWprZ9zTv2T82QIw"><circle cx="12" cy="5" r="2" data-page-node-id="5zPNG6DfqiqOhkkyciG6ER"/><circle cx="12" cy="12" r="2" data-page-node-id="shCkhGDSFlNVnC0UqX6DyG"/><circle cx="12" cy="19" r="2" data-page-node-id="pggjCcUkmtyNjdEJeD5UY8"/></svg></div>

      <!-- 视频信息浮层 -->
      <div class="info-layer" id="infoLayer" data-page-node-id="EHW8vstHAzPqCTNpTH6Pyb">
        <div class="author" data-page-node-id="uA45ks1QCC4dgNb5zZM42e">@<span id="infoAuthor" data-page-node-id="An6lqVZNmWry4uv0X5UdVk">forza_horizon</span> <span class="tag" data-page-node-id="UUDNFAwo8ACOovMMzROeaU">置顶</span></div>
        <div class="desc" id="infoDesc" data-page-node-id="mSuy1LwG3vWPuVz4oZu5B0">《极限竞速：地平线 6》实机首曝！这一代开放世界有多大？ #地平线6 #赛车游戏 #Xbox</div>

          <div class="disc" data-page-node-id="evDtTGMHdjxcRUSM2kqcsQ"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" data-page-node-id="WcAM3uUAVGemsqm3dkR3a8"><circle cx="12" cy="12" r="6" data-page-node-id="lMH1t1EqiRTda545vTe731"/></svg></div>

</div>

<!-- 评论抽屉 -->
<div class="drawer-overlay" id="drawerOverlay" data-page-node-id="qFQBKWmsa8WwnNBBIH3pLe"></div>
<div class="comment-drawer" id="commentDrawer" data-page-node-id="AFgXCp9jJx7DdGT23J318P">
  <div class="cm-head" data-page-node-id="EaOfLQHdkvKHozY1tnMnVy">
    <h3 id="cmTitle" data-page-node-id="CriH6w802LxV8DMYKCKULc">评论 (734)</h3>
    <span class="close" id="cmClose" data-page-node-id="CkKYs6JY387OuhdcD8PYhy">✕</span>
  </div>
  <div class="cm-list" id="cmList" data-page-node-id="QOvPbzYbSNk0cRfrPI91jX">
    <!-- JS 填充 -->
  </div>
  <div class="cm-input" data-page-node-id="1tyxsF6iUgUGbJyd8XUjRv">
    <input type="text" id="cmInput" placeholder="说点什么..." data-page-node-id="UDllUo1lPlK1RmUaHYPo6v">
    <button id="cmSend" data-page-node-id="rWu8tltoGNxFIyOT1ny98B">发送</button>
  </div>
</div>

<!-- 分享弹窗 -->
<ul class="share-pop" id="sharePop" data-page-node-id="axCZmezu3V1IeVxCHFcia2">
  <li data-to="friend" data-page-node-id="nYthS8ucUqzLDhAXWNPWyg">推荐给朋友</li>
  <li data-to="copy" data-page-node-id="Iv5FlPHDDiwFizPICIQ8Dz">复制链接</li>
  <li data-to="wechat" data-page-node-id="UocuFQf3JfuutaZF0RPBBQ">分享到微信</li>
</ul>

<script>
  // ========== 模拟视频数据 ==========
  // ========== 真实内容数据（来自后端 /api/feed/recommended，仅返回 APPROVED） ==========
  // 说明：P1.5 起公域推荐流与「个人中心 /api/media/mine」解耦，feed 走独立接口；
  // 后端已只返回 APPROVED，前端无需再内存过滤。演示阶段推荐接口返回当前 APPROVED 内容。
  let videos = [];

  function loadFeed() {
    var TOKEN = localStorage.getItem('turbofeed:token');
    if (!TOKEN) { location.href = 'login.html'; return; }
    fetch('http://localhost:8080/api/feed/recommended?page=0&size=20', {
      headers: { 'Authorization': 'Bearer ' + TOKEN }
    }).then(function (r) { return r.json(); })
      .then(function (res) {
        var items = (res.data || []);
        videos = items.map(function (i) {
          return {
            id: i.mediaId,
            author: '我',
            title: i.mediaId.split('/').pop(),
            tags: '#TurboFeed #UGC',
            music: '—',
            like: 0, comment: 0, fav: 0, share: 0,
            cover: i.url
          };
        });
        renderFeed();
      })
      .catch(function (e) { console.error('加载 feed 失败', e); renderFeed(); });
  }

  // 当前状态
  let currentIdx = 0;
  let playing = true;

  // 格式化数字
  function fmt(n) {
    if (n >= 10000) return (n / 10000).toFixed(n >= 100000 ? 0 : 1) + '万';
    return n.toString();
  }

  // 生成 feed DOM（数据来自 loadFeed，仅渲染已有 videos）
  function renderFeed() {
    var feedList = document.getElementById('feedList');
    feedList.innerHTML = '';
    if (!videos.length) {
      feedList.innerHTML = '<div style="padding:40px;text-align:center;color:#8b98ab">暂无已通过审核的内容，去后台上传图片吧</div>';
      return;
    }
    videos.forEach(function (v, i) {
      var div = document.createElement('div');
      div.className = 'feed-item';
      div.dataset.idx = i;
      var posterStyle = v.cover
        ? ("background-image:url('" + v.cover + "');background-size:cover;background-position:center;")
        : 'background:#1f4e79;';
      div.innerHTML = `
        <div class="video-wrap">
          <div class="video-poster" style="${posterStyle}"></div>
          <video class="video-el" loop playsinline muted poster data-idx="${i}"></video>
          <div class="play-mask" id="mask-${i}"><div class="big-play"><svg viewBox="0 0 24 24" width="34" height="34" fill="#fff"><polygon points="5 3 21 12 5 21 5 3"/></svg></div></div>
          <div class="progress"><div class="progress-bar" id="bar-${i}"></div></div>
        </div>
      `;
      feedList.appendChild(div);
    });
    currentIdx = 0;
    updateInfo(0);
    setPlay(0, true);
  }

  loadFeed();

  // ========== 视图更新 ==========
  function updateInfo(idx) {
    const v = videos[idx];
    document.getElementById('infoAuthor').textContent = v.author;
    document.getElementById('infoDesc').textContent = v.title + ' ' + v.tags;
    document.getElementById('infoMusic').textContent = v.music;
    document.getElementById('actionAvatar').textContent = v.author.charAt(0).toUpperCase();

    // 交互按钮状态重置（演示：每次切换都重置 liked/faved，方便反复点）
    const likeBtn = document.getElementById('btnLike');
    const favBtn = document.getElementById('btnFav');
    likeBtn.classList.remove('liked');
    favBtn.classList.remove('faved');
    likeBtn.dataset.liked = '0';
    favBtn.dataset.faved = '0';
    document.getElementById('likeCount').textContent = fmt(v.like);
    document.getElementById('commentCount').textContent = fmt(v.comment);
    document.getElementById('favCount').textContent = fmt(v.fav);
    document.getElementById('shareCount').textContent = fmt(v.share);
  }

  // ========== 播放控制 ==========
  function setPlay(idx, isPlay) {
    const mask = document.getElementById('mask-' + idx);
    const item = feedList.children[idx];
    if (!item) return;
    if (isPlay) {
      mask.classList.remove('show');
      // 静态演示：这里无真实视频源，仅模拟“播放”状态
      startProgress(idx);
    } else {
      mask.classList.add('show');
      stopProgress();
    }
    playing = isPlay;
  }

  let progressTimer = null;
  function startProgress(idx) {
    stopProgress();
    const bar = document.getElementById('bar-' + idx);
    let p = 0;
    bar.style.width = '0%';
    progressTimer = setInterval(() => {
      p += 0.5;
      if (p > 100) p = 0;
      bar.style.width = p + '%';
    }, 100);
  }
  function stopProgress() {
    if (progressTimer) clearInterval(progressTimer);
    progressTimer = null;
  }

  // ========== 滚动切换 ==========
  function gotoVideo(idx) {
    if (idx < 0) idx = 0;
    if (idx >= videos.length) idx = videos.length - 1;
    feedList.children[idx].scrollIntoView({ behavior: 'smooth', block: 'start' });
    currentIdx = idx;
    updateInfo(idx);
    setPlay(idx, true);
    // 把其他 mask 隐藏
    Array.from(feedList.children).forEach((el, i) => {
      if (i !== idx) {
        const m = el.querySelector('.play-mask');
        if (m) m.classList.remove('show');
      }
    });
  }

  feedList.addEventListener('scroll', () => {
    const center = feedList.scrollTop + feedList.clientHeight / 2;
    let best = 0;
    Array.from(feedList.children).forEach((el, i) => {
      const t = el.offsetTop;
      if (Math.abs(t - center) < Math.abs(feedList.children[best].offsetTop - center)) best = i;
    });
    if (best !== currentIdx) {
      currentIdx = best;
      updateInfo(best);
      setPlay(best, true);
    }
  });

  // ========== 交互按钮事件 ==========
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  document.getElementById('btnLike').addEventListener('click', function () {
    const v = videos[currentIdx];
    const liked = this.dataset.liked === '1';
    if (!liked) {
      this.classList.add('liked');
      v.like++;
      this.dataset.liked = '1';
      toast('已点赞 ❤️');
    } else {
      this.classList.remove('liked');
      v.like--;
      this.dataset.liked = '0';
      toast('取消点赞');
    }
    document.getElementById('likeCount').textContent = fmt(v.like);
  });

  document.getElementById('btnFav').addEventListener('click', function () {
    const v = videos[currentIdx];
    const faved = this.dataset.faved === '1';
    if (!faved) {
      this.classList.add('faved');
      v.fav++;
      this.dataset.faved = '1';
      toast('已收藏 ⭐');
    } else {
      this.classList.remove('faved');
      v.fav--;
      this.dataset.faved = '0';
      toast('取消收藏');
    }
    document.getElementById('favCount').textContent = fmt(v.fav);
  });

  // ========== 评论抽屉 ==========
  function genComments(n) {
    const names = ['极速车手', 'Redis老司机', '山城麦霸', '后端小黑', '极客小王', '路人甲', 'TurboViewer', '关注你了'];
    const txts = ['太强了，已三连', '这画质爱了', 'TurboFeed 这个项目开源了吗？', '沙发', '求背景音乐', '下次能不能讲讲分桶计数实现细节', '这就是赛车游戏的顶流吗', '收藏了慢慢看'];
    const arr = [];
    for (let i = 0; i < n; i++) {
      arr.push({
        name: names[i % names.length] + (i ? '' : ''),
        text: txts[i % txts.length],
        like: Math.floor(Math.random() * 500) + 1
      });
    }
    return arr;
  }

  function openComments() {
    const v = videos[currentIdx];
    document.getElementById('cmTitle').textContent = `评论 (${fmt(v.comment)})`;
    const list = document.getElementById('cmList');
    list.innerHTML = '';
    const comments = genComments(8);
    comments.forEach((c, i) => {
      const div = document.createElement('div');
      div.className = 'cm-item';
      div.innerHTML = `
        <div class="cm-avatar">${c.name.charAt(0).toUpperCase()}</div>
        <div class="cm-body">
          <div class="cm-user">${c.name}</div>
          <div class="cm-text">${c.text}</div>
          <div class="cm-actions"><span>回复</span><span>赞 ${fmt(c.like)}</span><span>举报</span></div>
        </div>
      `;
      list.appendChild(div);
    });
    document.getElementById('drawerOverlay').classList.add('show');
    document.getElementById('commentDrawer').classList.add('open');
  }
  function closeComments() {
    document.getElementById('drawerOverlay').classList.remove('show');
    document.getElementById('commentDrawer').classList.remove('open');
  }
  document.getElementById('btnComment').addEventListener('click', openComments);
  document.getElementById('cmClose').addEventListener('click', closeComments);
  document.getElementById('drawerOverlay').addEventListener('click', closeComments);

  document.getElementById('cmSend').addEventListener('click', function () {
    const input = document.getElementById('cmInput');
    const txt = input.value.trim();
    if (!txt) return;
    const v = videos[currentIdx];
    v.comment++;
    document.getElementById('commentCount').textContent = fmt(v.comment);
    document.getElementById('cmTitle').textContent = `评论 (${fmt(v.comment)})`;
    const list = document.getElementById('cmList');
    const div = document.createElement('div');
    div.className = 'cm-item';
    div.innerHTML = `
      <div class="cm-avatar">A</div>
      <div class="cm-body">
        <div class="cm-user">admin</div>
        <div class="cm-text">${txt}</div>
        <div class="cm-actions"><span>删除</span><span>赞 0</span></div>
      </div>
    `;
    list.insertBefore(div, list.firstChild);
    input.value = '';
    toast('评论已发送');
  });

  // ========== 分享 ==========
  const sharePop = document.getElementById('sharePop');
  document.getElementById('btnShare').addEventListener('click', function (e) {
    e.stopPropagation();
    sharePop.classList.toggle('show');
  });
  document.addEventListener('click', () => sharePop.classList.remove('show'));
  sharePop.addEventListener('click', function (e) {
    e.stopPropagation();
    const to = e.target.dataset.to;
    if (!to) return;
    const v = videos[currentIdx];
    if (to === 'copy') {
      navigator.clipboard && navigator.clipboard.writeText('https://turbofeed.dev/v/' + v.id);
      toast('链接已复制');
    } else if (to === 'friend') {
      v.share++;
      document.getElementById('shareCount').textContent = fmt(v.share);
      toast('已推荐给朋友');
    } else if (to === 'wechat') {
      toast('请使用微信扫码分享（演示）');
    }
    sharePop.classList.remove('show');
  });

  document.getElementById('btnMore').addEventListener('click', function () {
    toast('举报 / 不感兴趣 / 下载（演示占位）');
  });

  // 点击视频区域暂停/播放
  feedList.addEventListener('click', function (e) {
    if (e.target.closest('.video-wrap')) {
      setPlay(currentIdx, !playing);
    }
  });

  // 键盘上下切换
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); gotoVideo(currentIdx + 1); }
    if (e.key === 'ArrowUp') { e.preventDefault(); gotoVideo(currentIdx - 1); }
  });

  // 初始化
  updateInfo(0);
  setPlay(0, true);
</script>
